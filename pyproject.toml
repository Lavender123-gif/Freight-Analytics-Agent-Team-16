[project]
name = "freight-lineitems"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "regnartsw", email = "regnarts22@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "en-core-web-lg",
    "huggingface-hub>=2.4.0",
    "onnxruntime>=1.31.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "presidio-analyzer>=2.2.366",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "tokenizers>=0.23.3",
]

[project.scripts]
freight-lineitems = "freight_lineitems:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
# temporary test files stay inside the project, in a git-ignored folder (task 09 section 2; audit L5)
addopts = "--basetemp=data/interim/pytest_tmp"
