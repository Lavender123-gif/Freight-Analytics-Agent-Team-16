cards:
- id: S1
  column: W1
  tier: must
  plan_tasks:
  - S1
  name:
    zh: schema v1
    en: Schema v1
  kind: build
  weight: 1
  color: yellow
  evidence_level: in_sample
  status_line:
    zh: '任务 09 把 schema 定为 v1（`config/schema_v1.yaml`），SQLite 由它建表。任务 14：`dispute` 加 `n_rows`、`n_orders`、`invoice_dups_removed`，副本行以 `ORDER_COPY` 关联；Delta 相关两列停写。任务 20：加票货结果两张表 `shipment_result`、`shipment_line`；`reviewer_decision.action` 的 APPROVE 改为 ACCEPT_READING。组内评审没有开过，J1、J3 未答复，所以是黄'
    en: 'Task 09 fixed the schema as v1 (`config/schema_v1.yaml`); SQLite tables are built from it. Task 14: `dispute` gained `n_rows`, `n_orders`, `invoice_dups_removed`; copy rows link as `ORDER_COPY`; the two Delta columns are no longer written. Task 20: two shipment tables `shipment_result` and `shipment_line`; `reviewer_decision.action` APPROVE becomes ACCEPT_READING. No team review yet and J1, J3 unanswered, so yellow'
  what_is:
    lead:
      zh: 数据库的表结构定义：原始行、票货、发票、争议、每次解析尝试、数字读法、标识、判断、审核员的决定。
      en: 'the database table definitions: raw rows, shipments, invoices, disputes, every parse attempt, number readings, flags, assessments, reviewer decisions.'
  status_detail:
    lead:
      zh: '`config/schema_v1.yaml`，由任务 06 的 v0 定稿而来。两处待讨论项已定：批次内第一份按 Excel 行号（决定日志 D-26）；不一致时回给模型 1 次（待决 P-01，用户 11-10 定）。'
      en: '`config/schema_v1.yaml`, finalised from task 06''s v0. The two open points are settled: the first copy within a batch is by Excel row number (decision log D-26); one feedback round on a mismatch (pending P-01, set by the owner on 11-10).'
  deliverable_note:
    lead:
      zh: 没有单独的交付物文件夹；文件在 `config/`，建表代码在 `src/freight_lineitems/db.py`，测试 `tests/test_db.py`。
      en: no separate deliverable folder; the file is in `config/`, table creation in `src/freight_lineitems/db.py`, tests in `tests/test_db.py`.
  start_conditions:
    lead:
      zh: 已完成定稿。组内评审可以随时开。
      en: finalised. A team review can be held at any time.
  approach:
    lead:
      zh: 由 YAML 生成建表语句；表只追加不覆盖（每次尝试都留）。
      en: table creation statements are generated from the YAML; tables are append-only (every attempt is kept).
  depends:
    lead:
      zh: 前置：A3。被依赖：B01、B10、H1、U2。
      en: 'depends on: A3. Needed by: B01, B10, H1, U2.'
  open_items:
    lead:
      zh: 组内评审什么时候开，由我决定；J1、J3 回答后是否要改 `row_fingerprint`，等 Jake。
      en: when to hold the team review is decided by me; whether `row_fingerprint` changes after J1 and J3 are answered waits for Jake.
  completion_text:
    lead:
      zh: 和 schema 相关的待讨论项定下；YAML 升为 v1（计划 S1）。
      en: the schema-related open points are settled; the YAML becomes v1 (plan S1).
  criteria:
    target: light_green
    method:
      zh: 组内评审：组员逐表看一遍，问题记成清单并关闭
      en: 'team review: teammates read every table; issues are listed and closed'
    data:
      zh: '`config/schema_v1.yaml`；开发集全量运行库'
      en: '`config/schema_v1.yaml`; the full dev run database'
    threshold:
      zh: 未设定，开始检验前写入
      en: not set; to be written before the check starts
    threshold_preset: false
  needs_b04:
    value: 'no'
    note:
      zh: 评审不依赖模型。
      en: The review does not depend on the model.
  test_report: &id001
    zh: docs/deliverables/T10-autorun-leg2/test_report.zh.md
    en: docs/deliverables/T10-autorun-leg2/test_report.en.md
- id: B01
  column: W1
  tier: must
  plan_tasks:
  - S2
  - P2
  name:
    zh: 0-1 读入与门控
    en: 0-1 Read and gate
  kind: build
  weight: 1
  color: light_green
  evidence_level: in_sample
  status_line:
    zh: 任务 10：默认脱敏方式按事先写定的选择规则改为白名单反转（`allowlist`）：合成人名漏检从 29.0% 降到 10.9%，开发集上改动数字 0 条、费用词被遮 0 条，解析不差于波动范围。本卡建议的深绿门槛（漏检不超过 2%）**没有达到**，颜色不变。两个副作用列在待决 P-20：词表里没有的费用词会被遮住；公开 mock 上模型报告注入的次数变少。浅绿依据仍是原型的 908 条。任务 14：币种固定 USD（不再按国家推）；订单副本按（票货、Event Date、文字）合并成说明，开发集 953 行合成 908 条
    en: "Task 10: the default redaction engine was changed to the inverted allow-list (`allowlist`) by the selection rule written beforehand: the miss rate on synthetic names falls from 29.0% to 10.9%, with 0 records with altered digits and 0 masked charge words on the dev split, and parsing not worse than the run-to-run range. The dark-green threshold suggested on this card (miss rate at most 2%) is **not met**, so the colour does not change. Two side effects are in pending item P-20: charge words missing from the word list get masked, and on the public mock the model reports fewer injections. Light green still rests on the prototype's 908 events. Task 14: currency fixed to USD (no longer derived from country); order copies merge by (shipment, Event Date, text) into explanations, 953 dev rows into 908"
