cards:
- id: A1
  column: A
  name:
    zh: 开发集 / 测试集拆分
    en: Dev / test split
  kind: build
  weight: 1
  color: light_green
  evidence_level: in_sample
  status_line:
    zh: 按 shipment 拆，大承运商内 70/30，小承运商全进开发集；无重叠，测试集未动
    en: Split by shipment, 70/30 within larger carriers, small carriers all in dev; no overlap, test set untouched
  summary:
    claim:
      zh: 开发集和测试集按 shipment 拆分，两边没有共同的 shipment，行数守恒，测试集在开发期间未被打开。
      en: Dev and test are split by shipment, share no shipment, conserve rows, and the test set was not opened during development.
    tested:
      zh: 现有 5 个 pytest 测试，加上拆分检查脚本的 8 项检查（重叠、行数、shipment 数、每个 shipment 只有一个承运商）。
      en: The 5 existing pytest tests plus the 8 checks of the split-check script (overlap, row counts, shipment counts, one carrier per shipment).
    data:
      zh: 开发集全量 953 行；测试集只读 `SHIPMENT_GID` 一列计数（经批准的例外）。
      en: Full dev split, 953 rows; for the test set only the `SHIPMENT_GID` column was read, for counts (approved exception).
    result_vs_threshold:
      zh: 8 / 8 通过。通过条件（0 重叠、953 + 394 = 1347）写在 `tests/test_data_split.py` 和 `CLAUDE.md` 里，早于任务 03 的复跑；但只由写代码的一方核对过，没有人工审核。
      en: 8 / 8 pass. The pass conditions (0 overlap, 953 + 394 = 1347) were in `tests/test_data_split.py` and `CLAUDE.md` before task 03's rerun, but only the author side has checked them; no human review.
    limits:
      zh: 测试集主要反映最大承运商；不足 4 个 shipment 的承运商全在开发集，测试集测不到它们的写法。
      en: The test set mostly reflects the largest carrier; carriers with fewer than 4 shipments are all in dev, so the test set cannot measure their phrasing.
  what_is:
    lead:
      zh: 把原始数据按 shipment 拆成开发集和测试集，同一票货只在一边。开发全部用开发集，测试集只在最后跑一次。
      en: splits the raw data into dev and test sets by shipment, so one shipment is only on one side. All development uses dev; the test set runs once at the end.
  status_detail:
    lead:
      zh: 已完成。`src/freight_lineitems/data_split.py`，测试 `tests/test_data_split.py`（commit 42490b6）。在至少有 4 个 shipment 的承运商内按 70/30 抽 shipment，不足 4 个的承运商整个进开发集，种子 16。开发集 953 行 / 813 个 shipment，测试集 394 行 / 343 个 shipment，重叠 0。任务 03 重跑 `scratch/deliverables/A1_split_check.py`，8 项检查全过（经批准，只读测试集的 `SHIPMENT_GID` 列计数）。
      en: 'done. `src/freight_lineitems/data_split.py`, tests `tests/test_data_split.py` (commit 42490b6). Within carriers with at least 4 shipments, 30% of shipments go to test; carriers with fewer go wholly to dev; seed 16. Dev 953 rows / 813 shipments, test 394 rows / 343 shipments, overlap 0. Task 03 reran `scratch/deliverables/A1_split_check.py`: all 8 checks pass (with approval, only the test `SHIPMENT_GID` column was read, for counts).'
  deliverable_note:
    lead:
      zh: '`docs/deliverables/A1-dev-test-split/`：拆分检查，两边无重叠、行数守恒、现有 5 个测试通过。'
      en: '`docs/deliverables/A1-dev-test-split/`: split check — no overlap, row counts conserved, the 5 existing tests pass.'
  start_conditions:
    lead:
      zh: 已完成。需要重新拆分的情形：客户提供新数据（02 §10.2-10）。
      en: done. Re-splitting would be needed if the client provides new data (02 §10.2-10).
  approach:
    lead:
      zh: （已完成，记录做法）：按 shipment 分组（代码 `data_split.py`）；按承运商分层（同上）；小承运商整体留在开发集（同上）；固定种子保证可复现（同上）；用只读 ID 列的测试检查无重叠和行数守恒（`tests/test_data_split.py`）。
      en: '(done, recorded): group by shipment (code `data_split.py`); stratify by carrier (same); keep small carriers wholly in dev (same); fixed seed for reproducibility (same); tests that read only the ID column check overlap and row counts (`tests/test_data_split.py`).'
  depends:
    lead:
      zh: 前置：无。被依赖：A2、A3、B01、V1、V4。
      en: 'depends on: none. Needed by: A2, A3, B01, V1, V4.'
  open_items:
    lead:
      zh: ''
      en: ''
    bullets:
    - zh: 客户如果提供新一批数据，是作为第二个测试集、还是并入开发集——由我决定（02 §7.4、§10.2-10 提到新数据的用途，未定）。
      en: If the client provides a new batch of data, is it a second test set or added to dev — decided by me (02 §7.4 and §10.2-10 mention uses of new data; undecided).
  completion_text:
    lead:
      zh: 已满足：两边无 shipment 重叠，行数相加等于原始行数，测试集在开发期间未被打开（`CLAUDE.md` Data 节）。
      en: 'met: no shipment in both splits, row counts add up to the raw count, test set not opened during development (`CLAUDE.md` Data).'
  criteria:
    target: dark_green
    method:
      zh: 由写代码以外的组员独立复跑 `A1_split_check.py` 并审读 `data_split.py`
      en: a teammate other than the author reruns `A1_split_check.py` independently and reads `data_split.py`
    data:
      zh: 开发集全量；测试集只读 ID 列
      en: full dev split; test set ID column only
    threshold:
      zh: 0 个共同 shipment；行数相加等于 1347；审读无未解决问题 `[建议，待确认]`
      en: 0 shared shipments; rows add up to 1347; no unresolved review comments `[suggestion, to be confirmed]`
    threshold_preset: false
  needs_b04:
    value: 'no'
    note:
      zh: 升深绿只需要组员复核，不依赖 B04。
      en: Dark green only needs a teammate's review; does not depend on B04.
  deliverable_dir: docs/deliverables/A1-dev-test-split/
  test_report:
    zh: docs/deliverables/A1-dev-test-split/test_report.zh.md
    en: docs/deliverables/A1-dev-test-split/test_report.en.md
- id: A2
  column: A
  name:
    zh: 问题盘点 01、01b
    en: Problem inventory 01, 01b
  kind: analysis
  weight: 1
  color: light_green
  evidence_level: in_sample
  status_line:
    zh: 61 个关键数字重跑 57 个一致，2 个笔误，2 个无脚本输出
    en: 57 of 61 headline numbers reproduce; 2 typos; 2 printed by no script
  summary:
    claim:
      zh: （分析类）01、01b 的关键数字可由脚本复现，不一致之处已列出。
      en: (Analysis card) The key numbers of 01 and 01b can be reproduced by scripts, and the discrepancies are listed.
    tested:
      zh: 重跑 `scratch/analysis/a1-a11`，用正则取数，与报告里手抄的 61 个关键数字逐项对照。
      en: Rerun `scratch/analysis/a1-a11`, extract numbers by regex, and compare them one by one with 61 key numbers copied from the reports.
    data:
      zh: 开发集全量（953 行 / 908 条事件），就是写 01、01b 时读过的同一批数据。
      en: Full dev split (953 rows / 908 events), the same data that was read when writing 01 and 01b.
    result_vs_threshold:
      zh: 57 一致、2 不一致（笔误类）、2 无脚本输出。门槛未事先设定。
      en: 57 match, 2 differ (typos), 2 have no script output. Threshold not set in advance.
    limits:
      zh: 一致只说明脚本重跑得到同一个数，不说明脚本里的规则本身对；人工阅读的结论（如逐对核对 85 对）无法复现。
      en: A match only shows the script gives the same number again, not that its rules are right; conclusions from manual reading (e.g. the 85 pairs checked by hand) cannot be reproduced.
  what_is:
    lead:
      zh: 通读开发集，列出"要得到可信的 line items 需要解决的问题"（01 的 P1-P22），以及同一票货前后版本的对比（01b）。它们是设计方案 02 的事实基础。
      en: a read-through of the dev split listing "what must be solved to get trustworthy line items" (P1-P22 in 01) and a comparison of earlier and later versions within a shipment (01b). They are the factual basis of design 02.
  status_detail:
    lead:
      zh: 已完成。`docs/analysis/01_problem_inventory.md`、`01b_version_pairs.md`，脚本 `scratch/analysis/a1-a11`。任务 03 重跑全部 11 个脚本，61 个关键数字中 57 个一致；2 个不一致（01b §2.4 的 57 应为 56，笔误；01 P3 中 45 行之外 8 行的细分与 a4 输出不同，45 本身可复现，且 01b §5 已修正 P3）；2 个没有脚本输出（01 P11 的"最多 75 次"，01 P12 的下限 $20.09）。
      en: 'done. `docs/analysis/01_problem_inventory.md`, `01b_version_pairs.md`, scripts `scratch/analysis/a1-a11`. Task 03 reran all 11 scripts: 57 of 61 headline numbers match; 2 do not (01b §2.4''s 57 should be 56, a typo; the breakdown of the 8 rows outside the 45 in 01 P3 differs from a4''s output — the 45 itself reproduces and 01b §5 already corrects P3); 2 are printed by no script (01 P11 "at most 75 times", 01 P12 lower bound $20.09).'
  deliverable_note:
    lead:
      zh: '`docs/deliverables/A2-problem-inventory/`：01、01b 数字复现对照表和 5 个脱敏示例。'
      en: '`docs/deliverables/A2-problem-inventory/`: reproduction table for 01 and 01b, and 5 redacted examples.'
  start_conditions:
    lead:
      zh: 已完成。
      en: done.
  approach:
    lead:
