# docs/status/cards.yaml — 项目状态看板的单一数据源 / single source of the status board
#
# 卡片内容只改这个文件，然后运行生成脚本重新生成两版看板，不要手改生成的 Markdown：
# Edit card content here only, then regenerate both boards; never hand-edit the generated Markdown:
#   sh scratch/status/run.sh            # 生成 project_status.zh.md / .en.md
#   sh scratch/status/run.sh --check    # 只检查：链接、颜色规则、看板是否与本文件一致
#
# 中文为准；每个文字字段都有 zh / en 两份，在同一次修改里一起改。
# Chinese is authoritative; every text field has zh and en, edited together.
#
# 顶层 / top level
#   meta             更新时间 updated、任务 task、颜色 colors 与证据级别 evidence_levels 的定义、
#                    规则 rules、进度计算 progress（yellow_credit = 黄卡的部分分，现为 0）
#   columns          栏：id + 名称
#   overview_edges   总览图连线，每条是一条链 [A, B, C] = A --> B --> C
#   cards            卡片列表，顺序即看板顺序
#
# 每张卡 / per card
#   id               稳定编号，不重排；锚点为 card-<id 小写>
#   column           所属栏 id
#   name             卡片名称 {zh, en}
#   kind             build（实现）| analysis（分析类）| evaluation（评估）| delivery（交付）| owner（由我维护）
#   weight           计算整体进度时的权重
#   color            red | yellow | light_green | dark_green | grey
#   evidence_level   none | in_sample（样本内）| independent（独立样本）| human_review（人工审核）
#   status_line      一句话现状（总表里那一列）
#   summary          一屏摘要（有检验结果的卡才有）：claim 声称做到了什么 / tested 测了什么 /
#                    data 用什么数据 / result_vs_threshold 结果对比门槛 / limits 局限
#   note             只有灰卡用：一句说明
#   what_is .. completion_text
#                    从任务 03 看板逐字迁移的 8 项原文（是什么、现状与依据、交付物说明、开始条件、
#                    做法、前置依赖 / 被谁依赖、待决事项、完成标准）。每项是 {lead, bullets}：
#                    lead = 首句，bullets = 下面的条目。出处标注和 `[建议，待确认]` 原样保留。
#                    唯一的改写："变绿需要" → "变浅绿需要"（旧标准的绿 = 现在的浅绿）。
#   criteria         升到下一档的检验：target 目标颜色 / method 检验方法 / data 数据 /
#                    threshold 门槛 / threshold_preset 门槛是否在跑检验之前写定（true 才能用于深绿）
#   needs_b04        升到下一档是否依赖接上模型（B04）：value = yes | no | partly | self | n/a，note 说明
#   deliverable_dir  交付物文件夹（相对仓库根目录）；没有则省略
#   test_report      测试报告 {zh, en}（相对仓库根目录）；没有则省略
#
meta:
  updated: '2026-11-04'
  task:
    zh: '`docs/tasks/cc_task_07_status_plan.md`（任务 07）'
    en: '`docs/tasks/cc_task_07_status_plan.md` (task 07)'
  flow_note:
    zh: 流程图（按"谁来做"分泳道）：[`pipeline_flow.zh.html`](pipeline_flow.zh.html)，由 Archify 3.2.0 生成；源文件是 [`flow_src/pipeline_flow.zh.workflow.json`](flow_src/pipeline_flow.zh.workflow.json)（英文版对应 `.en.workflow.json`），修改和重新生成的方法见 [`flow_src/README.md`](flow_src/README.md)。GitHub 不渲染 `.html`，要下载后在浏览器打开。
    en: 'Pipeline flow (swimlanes by "who does it"): [`pipeline_flow.en.html`](pipeline_flow.en.html), generated by Archify 3.2.0; source is [`flow_src/pipeline_flow.en.workflow.json`](flow_src/pipeline_flow.en.workflow.json) (Chinese: `.zh.workflow.json`); how to edit and regenerate is in [`flow_src/README.md`](flow_src/README.md). GitHub does not render `.html`; download it and open it in a browser.'
  stable_ids:
    zh: 卡片编号是稳定 ID，以后增删卡片不重排。评估实验沿用 02 的 E1 到 E9 命名，所以评估这一栏用 V 开头。
    en: Card IDs are stable; adding or removing cards never renumbers. The evaluation experiments keep 02's names E1 to E9, so the evaluation column uses V.
  source_tags:
    zh: 来源标注：`02 §9.4` = `docs/analysis/02_design_proposal.md` 第 9.4 节；`02 §10.1-5` = 第 10.1 节第 5 项；`01 P12` = `01_problem_inventory.md` 的 P12；`01b §5` 同理；`CLAUDE.md` = 仓库根目录规则；"代码" = 指明的原型文件。来源里找不到、是任务 03 或任务 04 执行者自己的建议的，标 `[建议，待确认]`。"我" = 项目负责人。
    en: 'Source tags: `02 §9.4` = section 9.4 of `docs/analysis/02_design_proposal.md`; `02 §10.1-5` = item 5 of section 10.1; `01 P12` = P12 of `01_problem_inventory.md`; `01b §5` likewise; `CLAUDE.md` = the repository rules; "code" = the named prototype file. Items not found in any source, i.e. suggestions by the task-03 or task-04 executor, are tagged `[suggestion, to be confirmed]`. "Me" = the project owner.'
  colors:
    red:
      emoji: 🟥
      fill: '#f9d6d5'
      stroke: '#c62828'
      text: '#4a1010'
      name:
        zh: 红
        en: Red
      meaning:
        zh: 没开始
        en: not started
    yellow:
      emoji: 🟨
      fill: '#fff4c2'
      stroke: '#b8860b'
      text: '#4d3800'
      name:
        zh: 黄
        en: Yellow
      meaning:
        zh: 做了一部分，有明确缺口或待定项
        en: partly done, with explicit gaps or open items
    light_green:
      emoji: 🟩
      fill: '#d3f0d8'
      stroke: '#2e7d32'
      text: '#1b3d1f'
      name:
        zh: 浅绿
        en: Light green
      meaning:
        zh: 初步成型：已实现，开发集全量跑过，有交付物，但证据是样本内的
        en: 'taking shape: implemented, run on the full dev split, has a deliverable, but the evidence is in-sample'
    dark_green:
      emoji: ✅
      fill: '#2e7d32'
      stroke: '#1b5e20'
      text: '#ffffff'
      name:
        zh: 深绿
        en: Dark green
      meaning:
        zh: 验证通过：在独立样本或人工审核上，达到事先写定的门槛
        en: 'verified: meets a threshold written down in advance, on an independent sample or by human review'
    grey:
      emoji: ⬜
      fill: '#e6e6e6'
      stroke: '#777777'
      text: '#333333'
      name:
        zh: 灰
        en: Grey
      meaning:
        zh: 仓库里没有依据，由我本人维护
        en: no basis in the repository; maintained by me personally
  evidence_levels:
    none:
      name:
        zh: 无
        en: none
      meaning:
        zh: 还没有检验
        en: not tested yet
    in_sample:
      name:
        zh: 样本内
        en: in-sample
      meaning:
        zh: 用开发这部分时看过的同一批数据检验
        en: tested on the same data that was looked at while developing this part
    independent:
      name:
        zh: 独立样本
        en: independent sample
      meaning:
        zh: 用开发时没看过的数据检验，例如合成注入的测试数据
        en: tested on data not seen during development, e.g. synthetic injected test data
    human_review:
      name:
        zh: 人工审核
        en: human review
      meaning:
        zh: 由写代码以外的人抽样核对，或在测试集终测中检验
        en: spot-checked by someone other than the author of the code, or tested in the final test-set run
  rules:
    zh:
    - 浅绿要求至少样本内证据和交付物；深绿要求独立样本或人工审核证据，并且达到门槛。
    - 门槛必须在跑检验之前写进卡片的"完成标准"。现有检验如果当时没有事先定门槛，测试报告里如实写"门槛未事先设定"，这样的结果不能用来标深绿。
    - 分析类卡片（A2 问题盘点、A3 设计方案）的"检验"是脚本可复现与数字核对，按实际情况标级别，卡片里写明它是分析类。
    - 每张非深绿的卡片注明：升到下一档是否依赖接上模型（B04）。
    - 每次卡片变色，都必须有对应级别的测试报告作依据。
    en:
    - Light green needs at least in-sample evidence and a deliverable; dark green needs independent-sample or human-review evidence that meets the threshold.
    - The threshold must be written into the card's "done when" before the check is run. If an existing check had no threshold set in advance, its test report says "threshold not set in advance", and such a result cannot be used for dark green.
    - For analysis cards (A2 problem inventory, A3 design proposal) the "check" is script reproducibility and number cross-checking; the level is stated as it actually is, and the card says it is an analysis card.
    - Every card that is not dark green states whether moving up a level depends on connecting the model (B04).
    - Every colour change must be backed by a test report of the matching level.
  progress:
    yellow_credit: 0
    note:
      zh: '`[建议，待确认]` 权重方案：每张卡权重 1（`weight` 字段）；灰卡不进分母；黄卡不算部分分（黄卡做了多少没有测量，算分会让数字无法核对），黄卡张数单列。成型度 = Σ权重(浅绿 + 深绿) ÷ Σ权重(非灰卡)；验证度 = Σ权重(深绿) ÷ Σ权重(非灰卡)。'
      en: '`[suggestion, to be confirmed]` Weighting: every card has weight 1 (the `weight` field); grey cards are left out of the denominator; yellow cards get no partial credit (how much of a yellow card is done is not measured, so partial credit would make the number unauditable), and the yellow count is shown separately. Shaped = Σweight(light green + dark green) ÷ Σweight(non-grey cards); Verified = Σweight(dark green) ÷ Σweight(non-grey cards).'
    difference:
      zh: 成型度回答"做出来、在开发集上跑过、有交付物的有多少"；验证度回答"其中有多少经过没见过的数据或别人的核对、并且达到事先定的门槛"。两个数差得越多，越多的进度只靠样本内证据。
      en: Shaped answers "how much is built, run on the dev split and has a deliverable"; Verified answers "how much of that has been checked on unseen data or by someone else, against a threshold set in advance". The larger the gap, the more of the progress rests on in-sample evidence only.
