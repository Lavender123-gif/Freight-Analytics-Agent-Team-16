    result_vs_threshold:
      zh: 任务 03 重跑 17 个全过（只记在看板里，没有单独的结果文件）。门槛未事先设定。
      en: Task 03 reran the 17 and all passed (recorded only on the board; no separate result file). Threshold not set in advance.
    limits:
      zh: '`DOLLAR_EXCLUDED` 覆盖不全；`reconcile` 容差写死；没有真实模型提交。'
      en: '`DOLLAR_EXCLUDED` coverage is incomplete; the `reconcile` tolerance is hard-coded; no real-model submissions.'
  what_is:
    lead:
      zh: 在 `submit_line_items` 内部检查模型的提交：结构、引用、短语、单位冲突、对账、税、合计。"模型能改的错"退回给模型重试，"数据本身的问题"只记录。
      en: 'checks inside `submit_line_items`: structure, references, phrases, unit conflicts, reconciliation, tax, totals. "Errors the model can fix" go back to the model to retry; "problems in the data itself" are only recorded.'
  status_detail:
    lead:
      zh: 代码 `scratch/prototype/checks.py`、`tools.py`。只跑过 `prototype_checks.py` 的 17 个合成用例（任务 03 重跑 17 个全过）和 02 第 8 节走例（02 §7.1）。两处已知问题：
      en: 'code `scratch/prototype/checks.py`, `tools.py`. Only run on the 17 synthetic cases in `prototype_checks.py` (task 03 reran them: 17 pass) and the walk-throughs of 02 §8 (02 §7.1). Two known issues:'
    bullets:
    - zh: '`NUM.JUDGMENT.DOLLAR_EXCLUDED` 只在带 `$` 的金额被判为非金额或状态为 `NONE` 时触发（`checks.py` 第 300 行），没覆盖被判为已开票、已付、已扣状态的金额。'
      en: '`NUM.JUDGMENT.DOLLAR_EXCLUDED` fires only when a `$` amount is judged non-money or given status `NONE` (`checks.py` line 300); amounts judged billed, paid or deducted are not covered.'
    - zh: '`tools.py` 第 214 行 `reconcile` 的对账容差写死为 `Decimal("0.005")`，没从 `rules.yaml` 的 `tolerances.amount_abs` 读（`checks.py` 本身是从 `rules.yaml` 读的）。'
      en: '`tools.py` line 214 hard-codes the `reconcile` tolerance as `Decimal("0.005")` instead of reading `tolerances.amount_abs` from `rules.yaml` (`checks.py` itself does read it from `rules.yaml`).'
  deliverable_note:
    lead:
      zh: 变浅绿需要：两处问题修好后的合成用例结果，加上在开发集全量真实模型运行中退回、只记录各类诊断的触发统计 `[建议，待确认]`。
      en: 'to turn light green: synthetic-case results after both fixes, plus trigger statistics of the return and record-only diagnostics in a full real-model dev run `[suggestion, to be confirmed]`.'
  start_conditions:
    lead:
      zh: 修两处问题可以随时开始，但按任务规则需要我批准改原型代码，或在 D1 迁入 `src/` 时一起修 `[建议，待确认]`；全量检验需要 B04。
      en: the two fixes can start any time, but under the task rules changing prototype code needs my approval, or they can be done during D1's move into `src/` `[suggestion, to be confirmed]`; full validation needs B04.
  approach:
    lead:
      zh: ''
      en: ''
    bullets:
    - zh: 决定 `DOLLAR_EXCLUDED` 对已开票、已付、已扣状态的处理（见 7），再改检查和合成用例（02 D6）。
      en: Decide how `DOLLAR_EXCLUDED` treats billed / paid / deducted (see 7), then change the check and synthetic cases (02 D6).
    - zh: '`reconcile` 的容差改为从 `rules.yaml` 读，与 `checks.py` 一致（02 §5.3：阈值在配置里，不在代码里）。'
      en: 'Read the `reconcile` tolerance from `rules.yaml`, consistent with `checks.py` (02 §5.3: thresholds live in configuration, not code).'
    - zh: 在 B04 的全量运行上统计退回次数、原样重提、`PASSED_AFTER_RETURN`（02 §4.2、D5、D6）。
      en: In B04's full run, count returns, unchanged resubmissions and `PASSED_AFTER_RETURN` (02 §4.2, D5, D6).
    - zh: 对照 02 §7.3 的代理类别 A-D 检查对账结果 `[建议，待确认]`。
      en: Check reconciliation outcomes against 02 §7.3's proxy classes A-D `[suggestion, to be confirmed]`.
  depends:
    lead:
      zh: 前置：B02、B06、C1、C2。被依赖：B04（提交出口）、B08、B09。
      en: 'depends on: B02, B06, C1, C2. Needed by: B04 (submission exit), B08, B09.'
  open_items:
    lead:
      zh: ''
      en: ''
    bullets:
    - zh: '与 2026-11-04 决定不一致，待改：合计算两次仍是门槛（决定 3.4）；算式引用可选（3.3）；防凑数没覆盖全部状态（3.5）；`contains_number` 仍在（3.8）；费用代码依据没有别名核对（3.6）。颜色保持黄。'
      en: 'Conflicts with the 2026-11-04 decisions, to revise: total-counted-twice is still a gate (decision 3.4); arithmetic references are optional (3.3); anti-padding does not cover every status (3.5); `contains_number` is still there (3.8); charge-code evidence has no alias check (3.6). Colour stays yellow.'
    - zh: '`DOLLAR_EXCLUDED` 是否扩到已开票、已付、已扣状态——由我决定。注意：02 §7.3 把付款历史里留出的已付、已开票金额视为"不打 flag"，扩大覆盖会把这 5 条一起送去人工，要先定规则（02 §7.3、D6）。'
      en: 'Whether `DOLLAR_EXCLUDED` should cover billed / paid / deducted — decided by me. Note: 02 §7.3 treats paid or billed amounts left out in payment-history texts as "no flag"; widening coverage would send those 5 events to human review too, so the rule has to be settled first (02 §7.3, D6).'
    - zh: '`DOLLAR_EXCLUDED` 设为单独即转人工（约 1% 转人工）是否接受——由我决定（02 §10.1-4）。'
      en: Whether `DOLLAR_EXCLUDED` alone escalating (about 1% human review) is acceptable — decided by me (02 §10.1-4).
  completion_text:
    lead:
      zh: 两处问题修好；在开发集全量真实模型运行上跑过；有交付物 `[建议，待确认]`。
      en: both issues fixed; run on a full real-model dev run; deliverable exists `[suggestion, to be confirmed]`.
  criteria:
    target: light_green
