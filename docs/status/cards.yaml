    en: 'Task 14 (readings of the v1.2 version): under the two baselines 722 / 720 shipments equal the system''s default change; disagreements sorted into pre-written classes, unclassified 8.8% and 5.4%, threshold <= 15% (written after a trial). Not recomputed on the task-19 version'
