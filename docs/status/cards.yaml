      zh: '批量操作、之前批次的上下文、距离、草稿编辑属于 U4（Optional）；四个按钮是否对应 OTM 的实际操作，等 Jake（J10、J11）。按票货查看的视图和界面重做是下一步（任务 20 第 6 节）。'
      en: 'bulk actions, earlier-batch context, distance and draft editing belong to U4 (Optional); whether the four buttons match the real OTM actions waits for Jake (J10, J11). A by-shipment view and the redesign are next (task 20 section 6).'
  completion_text:
    lead:
      zh: 按发票列出颜色和按严重程度计数的标识，可按“有没有提醒”筛选；点开看到争议、模型说明、标识；争议一层四个按钮记录决定和理由；读我们的库（计划 U2）。
      en: invoices listed with colour and flags counted by severity, filterable by "has reminders"; opening shows disputes, model explanation, flags; four buttons at dispute level record decision and reason; reads our database (plan U2).
  criteria:
    target: dark_green
