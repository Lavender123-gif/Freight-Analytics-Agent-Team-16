  kind: build
  weight: 1
  color: yellow
  evidence_level: in_sample
  status_line:
    zh: '待改（与 2026-11-04 决定不一致）；只跑过 17 个合成用例和走例；两处已知问题'
    en: 'To revise (conflicts with the 2026-11-04 decisions); Only 17 synthetic cases and walk-throughs; two known issues'
  summary:
    claim:
      zh: 提交检查的逻辑在 17 个合成用例和 02 第 8 节走例上表现符合预期；有两处已知问题。
      en: The submission checks behave as expected on 17 synthetic cases and the 02 §8 walk-throughs; two known issues.
    tested:
      zh: '`scratch/prototype/prototype_checks.py` 的 17 个合成用例；02 第 8 节 10 条走例（第 3 步是扮演的）。'
      en: The 17 synthetic cases in `scratch/prototype/prototype_checks.py`; the 10 walk-throughs of 02 §8 (step 3 role-played).
