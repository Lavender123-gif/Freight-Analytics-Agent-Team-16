    en: 'After the four task-17 fixes, on the task-19 version (recomputed in task 20): annotations Recall 93.9% (31/33), FOR 3.6% (2/55); after the two labels corrected by D-97, 100% (31/31) and 0% (0/55); mock round 3 reading A Recall 94.2%, FOR 8.5%, reading B 96.7%, 6.8%. The mock is still below 95% and 2%; all in sample; the 4th mock round is needed. Task 20 mock round 4 (pre-registered): round-3 part Recall 95.4% (A) / 96.6% (B), FOR 6.8% not met; the 122 round-4 new events (independent) Recall 100% (6/6, interval 61-100), FOR 0% (0/37), too few positives; 79 / 116 false alarms on the new part, mostly replacement reminders (P-52). Task 20b (defined after the results, synthetic, no colour change): passed but shipment total wrong 0 / 561, all 48 shipments with a different total were sent; injections by written text: plain English 20/20, each category''s own misspellings 10/10, the 5 templates repeated across categories 18/30 (the 12 misses come from two templates; no amount was changed)'
