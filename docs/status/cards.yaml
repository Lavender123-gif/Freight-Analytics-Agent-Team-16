      zh: 读数板块改成核心 + 专题说明加注入筛查之后，漏报没有变多，送人工多 12 条，在事先写定的限度内。
      en: After the reading module became a core plus topic notes with injection screening, misses did not rise and 12 more explanations go to a person, within the pre-written limit.
    tested:
      zh: 开发集全量和 mock 第三轮各跑一遍新版本，和任务 17 的存档运行用同一脚本比；mock 按特征组和两种口径分开报。
      en: One run of the new version on the full dev split and on mock round 3, scored against task 17's stored runs by the same script; mock reported per feature group under both readings.
    data:
      zh: 开发集 908 条说明（含人工标注 101 条）；mock 第三轮 564 条说明、568 个事件。都是样本内。
      en: 908 dev explanations (101 annotated); mock round 3, 564 explanations, 568 events. Both in sample.
    result_vs_threshold:
      zh: 标注 Recall 93.9% ≥ 93.9%；mock 各组 Recall 都不低于任务 17（A 总 91.7% → 94.2%，B 94.7% → 96.7%）；开发集送人工 225 ≤ 233；筛查开发集命中 0 ≤ 5。门槛写在本卡（提交 db8f121）。
      en: Annotation Recall 93.9% >= 93.9%; no mock group lower than task 17 (A 91.7% -> 94.2%, B 94.7% -> 96.7%); 225 <= 233 dev explanations sent; 0 <= 5 screening hits on dev. Gates written on this card beforehand (commit db8f121).
    limits:
      zh: 样本内；第四轮 mock 和预留 mock 还没跑；多出的 12 条都是模型对空格合并重量的自报疑问。
      en: In sample; the 4th mock round and the reserved mock are not run yet; the 12 extra are all the model's doubts about space-merged weights.
