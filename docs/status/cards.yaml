      zh: 已完成最小可用版。
      en: the minimum version is done.
  approach:
    lead:
      zh: 直接读运行库 `run.sqlite`，写同一个库的 `reviewer_decision` 表；动作的取值从 schema 读，不在取值表里的动作一律拒绝。
      en: reads the run database `run.sqlite` directly and writes the `reviewer_decision` table of the same database; action values come from the schema, and any other action is refused.
  depends:
    lead:
      zh: 前置：U1、B10、B09。被依赖：F3。
      en: 'depends on: U1, B10, B09. Needed by: F3.'
  open_items:
