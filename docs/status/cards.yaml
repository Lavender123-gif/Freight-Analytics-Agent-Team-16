    - zh: 是否给脱敏加"费用词不脱敏"白名单（避免误删 `TONU`）——由我决定（02 §10.1-6）。
      en: Whether to add a "do not redact charge words" whitelist (to avoid removing `TONU`) — decided by me (02 §10.1-6).
    - zh: 能否提供员工名单只用于本地匹配——由客户回答（02 §10.2-9）。
      en: Whether an employee list can be provided for local matching only — answered by the client (02 §10.2-9).
