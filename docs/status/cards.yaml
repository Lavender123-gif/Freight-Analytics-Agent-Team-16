    threshold:
      zh: 2026-11-15 在任何回归运行之前写定（任务 19 第 3 节）。(1) 人工标注 Recall ≥ 93.9%（任务 17：31 / 33）。(2) mock 第三轮，按 mock 答案（A）和按我们的标准（B）两种口径，每个特征组的 Recall 都不低于任务 17：A 口径 税 100%（14/14）、余额已付已开票 100%（28/28）、历史 100%（68/68）、无特征组 86.2%（137/159）、注入写法像客户数据 67.5%（27/40）、注入故意拼错拆字 70.0%（14/20）；B 口径 税 100%（20/20）、余额已付已开票 100%（32/32）、单价数量 100%（8/8）、历史 100%（83/83）、无特征组 91.6%（206/225）、注入两组同 A；没有阳性的组（费率更正、贷记；A 口径的单价数量）不评。(3) 开发集全量送人工的说明 ≤ 233 条（任务 17 的 213 条 + 20）。(4) 注入筛查在开发集 908 条里命中 ≤ 5 条；超过就把它的标识降为只提示（info），其余门槛按降级后的结果算。(5) routed 不过就试 single；两个都不过，开关保持 single 并写明原因
      en: 'Written on 2026-11-15 before any regression run (task 19 section 3). (1) Annotation Recall >= 93.9% (task 17: 31 / 33). (2) Mock round 3, under both the mock answers (A) and our standard (B), every feature group''s Recall at least task 17''s: A tax 100% (14/14), balance/paid/billed 100% (28/28), history 100% (68/68), no group 86.2% (137/159), injection written like ordinary data 67.5% (27/40), injection deliberately disguised 70.0% (14/20); B tax 100% (20/20), balance/paid/billed 100% (32/32), unit rate 100% (8/8), history 100% (83/83), no group 91.6% (206/225), the two injection groups as under A; groups without positives (rate correction, credit; unit rate under A) are not scored. (3) Full dev split: explanations sent to a person <= 233 (task 17''s 213 + 20). (4) Injection screening hits <= 5 of the 908 dev explanations; above that its flag becomes info, and the other gates are computed after the downgrade. (5) If routed fails, try single; if both fail, the switch stays single with the reasons written'
    threshold_preset: true
  needs_b04:
    value: 'yes'
    note:
      zh: 要在真实模型运行中被使用过。
      en: It must be used in a real-model run.
