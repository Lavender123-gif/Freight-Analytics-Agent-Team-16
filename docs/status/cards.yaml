    zh: '任务 10：自建，只用标准库，只在本机运行。按发票列出颜色和按严重程度计数的标识，点开看到争议、模型说明和标识，四个按钮把决定和理由追加到 `reviewer_decision` 表；在开发集全量运行库上只读启动过。任务 20：“批准”按钮改名为 `ACCEPT_READING`（界面“认可这份读法”，P-24 已定），加了把 `reviewer_decision` 导出成 CSV 的选项（`--export-decisions`）。任务 20b：发票表头改为直接读主流程存下的票货结果（`shipment_result.result`，和 `shipments.jsonl` 同一份）：票货建议和颜色、默认新总额和变化、另一读法总额、写明的应付数和 gap、票货提醒；删掉页面自己相加的合计；页面文字全部改成英文（审核决定的取值不变）；27 个测试通过，含照第四轮 mock SHP-R4-PT-00 合成的取代票货。还没有人扮审核员走过一遍。任务 23（审计 F-02）：列表的提醒计数、“有提醒”筛选和默认排序算上票货级提醒；加了只有票货级提醒的回归测试（旧代码在这个用例上漏掉，和审计复现一致）'
