  summary:
    claim:
      zh: 审核界面做到了计划 U2 完成标准的四项，并能打开开发集全量的运行库。
      en: The review interface meets the four items of plan U2's done-when text and opens the full dev run database.
    tested:
      zh: 19 个 pytest（合成数据）；在开发集全量运行库上只读启动，查接口返回的汇总数；确认只读模式拒绝写入、库文件不变。
      en: 19 pytest tests (synthetic data); started read-only on the full dev run database and its API aggregates checked; confirmed that read-only mode refuses writes and leaves the database file unchanged.
    data:
      zh: 合成数据（测试）；开发集全量运行库 953 笔争议（样本内；v1.1 加旧脱敏方式的那次运行）。
      en: Synthetic data (tests); the full dev run database, 953 disputes (in-sample; the run made with v1.1 and the old redaction engine).
    result_vs_threshold:
      zh: 列出 953 笔争议、813 张发票；写入请求被拒绝，库文件校验值前后相同。没有数字门槛。
      en: Lists 953 disputes and 813 invoices; a write request is refused and the database checksum is the same before and after. No numeric threshold.
    limits:
      zh: 记录决定只在合成数据的测试里和样本 A 上试过；没有人工走查；距离、之前批次的上下文、批量操作没做（U4）。
      en: recording decisions was exercised only in synthetic-data tests and on sample A; no human walk-through; distance, earlier-batch context and bulk actions are not built (U4).
  what_is:
    lead:
      zh: 审核员用的本地网页：看每张发票、每笔争议读得怎么样，记录自己的决定。界面不对费用该不该付给任何建议。
      en: 'a local web page for reviewers: see how each invoice and dispute was read and record their own decision. The interface gives no suggestion on whether a charge should be paid.'
  status_detail:
    lead:
      zh: '`src/freight_lineitems/review_ui.py`、`review_ui.html`，测试 `tests/test_review_ui.py`。决定只追加，库里用触发器禁止修改和删除；只读模式下不出现按钮。'
      en: '`src/freight_lineitems/review_ui.py`, `review_ui.html`, tests `tests/test_review_ui.py`. Decisions are append-only, with database triggers forbidding update and delete; read-only mode shows no buttons.'
  deliverable_note:
