      zh: 人工标注（严格版）；mock 第三轮；任务 20：第四轮公开 mock，第三轮部分（568 个事件，存档读法，样本内）和第四轮新增（122 个事件，新跑，独立检验）分开报，口径 A、B 分开，另报注入两组、票货新总额、加权的“接近真实”Recall（写法类别、优先顺序、权重、Kish 有效样本量见 `docs/deliverables/T20-mvp/02-r4-preregistration.zh.md`，在任何结果之前提交）
