      en: '(done, recorded): claim dates and times before numbers (02 §1.2); record raw form, `$`, space merging, leading dot, minus, neighbouring words, unit word (02 §2.1); unclaimed digits become unrecognized regions for the model (02 §3); the model''s reading is checked digit by digit (02 §4.3 `NUM.READ.*`).'
