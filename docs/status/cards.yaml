      en: 'Task 19 regression: the new reading module (skill_layout routed, single if needed) plus the injection screening, run on the full dev split and mock round 3; scored by `scratch/eval/t19_eval.py` as in task 17 (sent = today''s system on the stored reading); baseline = task 17''s stored runs `devFullV12-5d09`, `mockR3V12-f0d3`, rescored by the same script and equal to the task-17 report'
