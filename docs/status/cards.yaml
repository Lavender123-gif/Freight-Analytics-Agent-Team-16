      en: 'Conflicts with the 2026-11-04 decisions, to revise: rows are merged on five fields, while decision 5.3 keeps every copy as its own record; raw rows and currency are not stored per schema v0 (decision 4.3). Colour `[suggestion, to be confirmed]`: yellow until rebuilt on the schema.'
