# docs/status/cards.yaml — 项目状态看板的单一数据源 / single source of the status board
#
# 卡片内容只改这个文件，然后运行生成脚本重新生成两版看板，不要手改生成的 Markdown：
# Edit card content here only, then regenerate both boards; never hand-edit the generated Markdown:
#   sh scratch/status/run.sh            # 生成 project_status.zh.md / .en.md
#   sh scratch/status/run.sh --check    # 只检查：链接、颜色规则、看板是否与本文件一致
#
# 中文为准；每个文字字段都有 zh / en 两份，在同一次修改里一起改。
# Chinese is authoritative; every text field has zh and en, edited together.
#
# 顶层 / top level
#   meta             更新时间 updated、任务 task、颜色 colors 与证据级别 evidence_levels 的定义、
#                    规则 rules、进度计算 progress（yellow_credit = 黄卡的部分分，现为 0）
#   columns          栏：id + 名称
#   overview_edges   总览图连线，每条是一条链 [A, B, C] = A --> B --> C
#   cards            卡片列表，顺序即看板顺序
#
# 每张卡 / per card
#   id               稳定编号，不重排；锚点为 card-<id 小写>
#   column           所属栏 id
#   name             卡片名称 {zh, en}
#   kind             build（实现）| analysis（分析类）| evaluation（评估）| delivery（交付）| owner（由我维护）
#   weight           计算整体进度时的权重
#   color            red | yellow | light_green | dark_green | grey
#   evidence_level   none | in_sample（样本内）| independent（独立样本）| human_review（人工审核）
#   status_line      一句话现状（总表里那一列）
#   summary          一屏摘要（有检验结果的卡才有）：claim 声称做到了什么 / tested 测了什么 /
#                    data 用什么数据 / result_vs_threshold 结果对比门槛 / limits 局限
#   note             只有灰卡用：一句说明
#   what_is .. completion_text
#                    从任务 03 看板逐字迁移的 8 项原文（是什么、现状与依据、交付物说明、开始条件、
#                    做法、前置依赖 / 被谁依赖、待决事项、完成标准）。每项是 {lead, bullets}：
#                    lead = 首句，bullets = 下面的条目。出处标注和 `[建议，待确认]` 原样保留。
#                    唯一的改写："变绿需要" → "变浅绿需要"（旧标准的绿 = 现在的浅绿）。
#   criteria         升到下一档的检验：target 目标颜色 / method 检验方法 / data 数据 /
#                    threshold 门槛 / threshold_preset 门槛是否在跑检验之前写定（true 才能用于深绿）
#   needs_b04        升到下一档是否依赖接上模型（B04）：value = yes | no | partly | self | n/a，note 说明
#   tier             must = 对应 11 月 5 日计划的 Must 任务，进整体进度的分母；optional = 计划里降为可选或不在计划里，
#                    只展示、不进分母；foundation = 计划之前已完成的基础工作，只展示、不进分母
#   plan_tasks       对应的计划任务编号（docs/plan/2026-11-05_workload_v2.zh.md 第 3 节）。注意卡片编号和计划编号是两套：
#                    卡片 D1、D2、V1 不是计划任务 D1、D2、V1。Must 任务的清单、工时、负责方和状态在 docs/status/progress.yaml
#   deliverable_dir  交付物文件夹（相对仓库根目录）；没有则省略
#   test_report      测试报告 {zh, en}（相对仓库根目录）；没有则省略
#
meta:
  updated: '2026-11-15'
  update_note:
    zh: '**上次同步之后发生了什么**：里程碑进展报告 [`2026-11-15_milestone_report.zh.md`](2026-11-15_milestone_report.zh.md)（英文版是仓库根目录的 `PROGRESS_UPDATE.md`）；上一份是 [`2026-11-10_progress_update.zh.md`](2026-11-10_progress_update.zh.md)。'
    en: '**What happened since the last sync**: milestone progress report [`PROGRESS_UPDATE.md`](../../PROGRESS_UPDATE.md) (2026-11-15); the previous one is archived as [`2026-11-10_PROGRESS_UPDATE.md`](2026-11-10_PROGRESS_UPDATE.md).'
  task:
    zh: '`docs/tasks/cc_task_20_mvp_wrapup.md`（任务 20）'
    en: '`docs/tasks/cc_task_20_mvp_wrapup.md` (task 20)'
  flow_note:
    zh: 流程图（按"谁来做"分泳道）：[`pipeline_flow.zh.html`](pipeline_flow.zh.html)，由 Archify 3.2.0 生成；源文件是 [`flow_src/pipeline_flow.zh.workflow.json`](flow_src/pipeline_flow.zh.workflow.json)（英文版是仓库根目录的 [`WORKFLOW.md`](../../WORKFLOW.md)，由 `.en.workflow.json` 生成），修改和重新生成的方法见 [`flow_src/README.md`](flow_src/README.md)。GitHub 不渲染 `.html`，要下载后在浏览器打开。
    en: 'Pipeline flow with one sentence per step: [`WORKFLOW.md`](../../WORKFLOW.md) (a Mermaid diagram GitHub renders), generated from [`flow_src/pipeline_flow.en.workflow.json`](flow_src/pipeline_flow.en.workflow.json); the interactive Archify diagram exists in Chinese only ([`pipeline_flow.zh.html`](pipeline_flow.zh.html)); how to edit and regenerate is in [`flow_src/README.md`](flow_src/README.md).'
  stable_ids:
    zh: 卡片编号是稳定 ID，以后增删卡片不重排。评估实验沿用 02 的 E1 到 E9 命名，所以评估这一栏用 V 开头。
    en: Card IDs are stable; adding or removing cards never renumbers. The evaluation experiments keep 02's names E1 to E9, so the evaluation column uses V.
  source_tags:
    zh: 来源标注：`02 §9.4` = `docs/analysis/02_design_proposal.md` 第 9.4 节；`02 §10.1-5` = 第 10.1 节第 5 项；`01 P12` = `01_problem_inventory.md` 的 P12；`01b §5` 同理；`CLAUDE.md` = 仓库根目录规则；"代码" = 指明的原型文件。来源里找不到、是任务 03 或任务 04 执行者自己的建议的，标 `[建议，待确认]`。"我" = 项目负责人。
    en: 'Source tags: `02 §9.4` = section 9.4 of `docs/analysis/02_design_proposal.md`; `02 §10.1-5` = item 5 of section 10.1; `01 P12` = P12 of `01_problem_inventory.md`; `01b §5` likewise; `CLAUDE.md` = the repository rules; "code" = the named prototype file. Items not found in any source, i.e. suggestions by the task-03 or task-04 executor, are tagged `[suggestion, to be confirmed]`. "Me" = the project owner.'
  colors:
    red:
      emoji: 🟥
      fill: '#f9d6d5'
      stroke: '#c62828'
      text: '#4a1010'
      name:
        zh: 红
        en: Red
      meaning:
        zh: 没开始
        en: not started
    yellow:
      emoji: 🟨
      fill: '#fff4c2'
      stroke: '#b8860b'
      text: '#4d3800'
      name:
        zh: 黄
        en: Yellow
      meaning:
        zh: 做了一部分，有明确缺口或待定项
        en: partly done, with explicit gaps or open items
    light_green:
      emoji: 🟩
      fill: '#d3f0d8'
      stroke: '#2e7d32'
      text: '#1b3d1f'
      name:
        zh: 浅绿
        en: Light green
      meaning:
        zh: 初步成型：已实现，开发集全量跑过，有交付物，但证据是样本内的
        en: 'taking shape: implemented, run on the full dev split, has a deliverable, but the evidence is in-sample'
    dark_green:
      emoji: ✅
      fill: '#2e7d32'
      stroke: '#1b5e20'
      text: '#ffffff'
      name:
        zh: 深绿
        en: Dark green
      meaning:
        zh: 验证通过：在独立样本或人工审核上，达到事先写定的门槛
        en: 'verified: meets a threshold written down in advance, on an independent sample or by human review'
    grey:
      emoji: ⬜
      fill: '#e6e6e6'
      stroke: '#777777'
      text: '#333333'
      name:
        zh: 灰
        en: Grey
      meaning:
        zh: 不按证据定色：由我本人维护，或已按决定删除
        en: 'not coloured by evidence: maintained by me personally, or removed by decision'
  evidence_levels:
    none:
      name:
        zh: 无
        en: none
      meaning:
        zh: 还没有检验
        en: not tested yet
    in_sample:
      name:
        zh: 样本内
        en: in-sample
      meaning:
        zh: 用开发这部分时看过的同一批数据检验
        en: tested on the same data that was looked at while developing this part
    independent:
      name:
        zh: 独立样本
        en: independent sample
      meaning:
        zh: 用开发时没看过的数据检验，例如合成注入的测试数据
        en: tested on data not seen during development, e.g. synthetic injected test data
    human_review:
      name:
        zh: 人工审核
        en: human review
      meaning:
        zh: 由写代码以外的人抽样核对，或在测试集终测中检验
        en: spot-checked by someone other than the author of the code, or tested in the final test-set run
  rules:
    zh:
    - 浅绿要求至少样本内证据和交付物；深绿要求独立样本或人工审核证据，并且达到门槛。
    - 门槛必须在跑检验之前写进卡片的"完成标准"。现有检验如果当时没有事先定门槛，测试报告里如实写"门槛未事先设定"，这样的结果不能用来标深绿。
    - 分析类卡片（A2 问题盘点、A3 设计方案、U1 工具评估）的“检验”是脚本可复现与数字核对，按实际情况标级别，卡片里写明它是分析类。
    - 每张非深绿的卡片注明：升到下一档是否依赖接上模型（B04）。
    - 每次卡片变色，都必须有对应级别的测试报告作依据。
    en:
    - Light green needs at least in-sample evidence and a deliverable; dark green needs independent-sample or human-review evidence that meets the threshold.
    - The threshold must be written into the card's "done when" before the check is run. If an existing check had no threshold set in advance, its test report says "threshold not set in advance", and such a result cannot be used for dark green.
    - For analysis cards (A2 problem inventory, A3 design proposal, U1 tool evaluation) the "check" is script reproducibility and number cross-checking; the level is stated as it actually is, and the card says it is an analysis card.
    - Every card that is not dark green states whether moving up a level depends on connecting the model (B04).
    - Every colour change must be backed by a test report of the matching level.
  progress:
    yellow_credit: 0
    note:
      zh: '分母只算对应 Must 任务的非灰卡片（`tier: must`），每张权重 1。灰卡（由我维护的、已按决定删除的）和旧设计里降为 Optional 的评估实验只展示、不进分母（项目负责人 2026-11-10 确认）。另有三处是任务 10 按同一条规则做的，`[建议，待确认]`：计划之前完成的基础卡 A1 到 A3 不进分母；不在计划里的 F2 不进分母；V2 卡复用为计划任务 V3a。黄卡不算部分分（黄卡做了多少没有测量，算分会让数字无法核对），黄卡张数单列。成型度 = Σ权重(浅绿 + 深绿) ÷ Σ权重(分母)；验证度 = Σ权重(深绿) ÷ Σ权重(分母)。这两个数按卡片的证据算，和 `progress.zh.md` 里按工时算的工作量、完成度不是一回事。'
      en: 'The denominator counts only non-grey cards mapped to a Must task (`tier: must`), weight 1 each. Grey cards (maintained by me, or removed by decision) and the old-design evaluation experiments demoted to Optional are shown but left out (confirmed by the project owner on 2026-11-10). Three more choices were made by task 10 under the same rule and are `[suggestion, to be confirmed]`: foundation cards A1 to A3, finished before the plan, are left out; F2, which is not in the plan, is left out; card V2 is reused for plan task V3a. Yellow cards get no partial credit (how much of a yellow card is done is not measured, so partial credit would make the number unauditable), and the yellow count is shown separately. Shaped = Σweight(light green + dark green) ÷ Σweight(denominator); Verified = Σweight(dark green) ÷ Σweight(denominator). These two numbers follow card evidence and are not the same thing as the hour-based workload and completion in `progress.zh.md`.'
    difference:
      zh: 成型度回答"做出来、在开发集上跑过、有交付物的有多少"；验证度回答"其中有多少经过没见过的数据或别人的核对、并且达到事先定的门槛"。两个数差得越多，越多的进度只靠样本内证据。
      en: Shaped answers "how much is built, run on the dev split and has a deliverable"; Verified answers "how much of that has been checked on unseen data or by someone else, against a threshold set in advance". The larger the gap, the more of the progress rests on in-sample evidence only.
  tiers:
    must:
      name:
        zh: Must
        en: Must
    optional:
      name:
        zh: Optional
        en: Optional
    foundation:
      name:
        zh: 基础
        en: Foundation
  must_note:
    zh: 看板从任务 10 起按 11 月 5 日计划（`docs/plan/2026-11-05_workload_v2.zh.md` 第 3 节）的 23 个 Must 任务重排：栏是计划的工作线，每张卡标明对应的计划任务。卡片编号不变，所以卡片编号和计划编号是两套：卡片 D1、D2、V1 不是计划任务 D1、D2、V1，以“计划任务”一列为准。任务的工时、负责方和状态在 [`progress.yaml`](progress.yaml)，汇总在 [`progress.zh.md`](progress.zh.md)。
    en: 'From task 10 the board follows the 23 Must tasks of the 2026-11-05 plan (`docs/plan/2026-11-05_workload_v2.zh.md`, section 3): columns are the plan''s work lines and every card names its plan task. Card IDs are unchanged, so card IDs and plan IDs are two separate sets: cards D1, D2, V1 are not plan tasks D1, D2, V1; the "plan task" column is authoritative. Hours, owner and status per task are in [`progress.yaml`](progress.yaml), summarised in [`progress.zh.md`](progress.zh.md) (Chinese only).'
