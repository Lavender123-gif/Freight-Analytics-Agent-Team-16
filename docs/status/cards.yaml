      en: '(done, recorded): collapse on (shipment, Event Date, text, Invoice Amount, Delta) (02 §1.2); redact with dictionary casing + Presidio + context rules (02 D10); compare digit characters before and after redaction (02 §3); check injection with the instruction-like patterns in `rules.yaml` (02 §5.3); record Delta sign and cross-border (02 §3).'
