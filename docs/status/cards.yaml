  evidence_level: in_sample
  status_line:
    zh: 529 种文本覆盖检查全过
    en: All 529 distinct texts pass the coverage check
  summary:
    claim:
      zh: 开发集 529 种文本里的每个数字字符都被认领（覆盖检查全过），8 种诊断计数与 02 一致。
      en: Every digit in the 529 distinct dev texts is claimed (coverage check passes), and the 8 diagnostic counts match 02.
    tested:
      zh: 覆盖检查、数字特征计数、第 2 步诊断计数对照 02 §7.2。
      en: Coverage check, number-feature counts, and step-2 diagnostic counts vs 02 §7.2.
    data:
      zh: 开发集全量 908 条事件 / 529 种脱敏文本；解析规则来自这批数据的写法。
      en: Full dev split, 908 events / 529 distinct redacted texts; the parsing rules come from this data's phrasing.
    result_vs_threshold:
      zh: 529 / 529 通过，计数全部一致。覆盖 100% 是设计上的不变量，但没有事先写成本卡的门槛；切分正确率没有测。
      en: 529 / 529 pass; all counts match. 100% coverage is a design invariant, but it was not written down as this card's threshold in advance; segmentation accuracy is not measured.
    limits:
      zh: 覆盖只保证没有漏，不保证切对（空格合并是推断）；未见承运商的新写法会落到未识别区域。
      en: Coverage only guarantees nothing is missed, not that the split is right (space merging is inferred); new phrasings from unseen carriers fall into unrecognised regions.
  what_is:
    lead:
      zh: 把脱敏文本里的每个数字找全、编号，先认领日期，记下每个数字的客观特征；覆盖检查保证没有数字字符被漏掉。模型之后只能引用这些编号。
      en: finds and numbers every number in the redacted text, claiming dates first, and records each number's objective features; the coverage check guarantees no digit character is missed. The model can later only refer to these ids.
  status_detail:
    lead:
      zh: 代码 `scratch/prototype/number_parse.py`、`checks.py` 的第 2 步检查。529 种文本覆盖检查全过（02 §7.2）；任务 03 重跑 `scratch/deliverables/B02_number_parse.py`，覆盖检查和 8 种诊断计数全部一致。
      en: 'code `scratch/prototype/number_parse.py` and the step-2 checks in `checks.py`. All 529 texts pass the coverage check (02 §7.2); task 03 reran `scratch/deliverables/B02_number_parse.py`: coverage and the 8 diagnostic counts all match.'
  deliverable_note:
    lead:
      zh: '`docs/deliverables/B02-number-parse/`：覆盖检查、特征计数和 5 个"文本 → 标记文本 + 数字表"例子。'
      en: '`docs/deliverables/B02-number-parse/`: coverage check, feature counts, 5 "text → marked text + number table" examples.'
  start_conditions:
    lead:
      zh: 已完成。
      en: done.
  approach:
    lead:
      zh: （已完成，记录做法）：先认领日期时间再认领数字（02 §1.2）；记录原文写法、`$`、空格合并、前导点、减号、前后词、单位词（02 §2.1）；没认领的数字字符成为未识别区域交给模型（02 §3）；模型的解读逐位比对（02 §4.3 `NUM.READ.*`）。
      en: '(done, recorded): claim dates and times before numbers (02 §1.2); record raw form, `$`, space merging, leading dot, minus, neighbouring words, unit word (02 §2.1); unclaimed digits become unrecognized regions for the model (02 §3); the model''s reading is checked digit by digit (02 §4.3 `NUM.READ.*`).'
  depends:
    lead:
      zh: 前置：B01。被依赖：B03、B04、B07。
      en: 'depends on: B01. Needed by: B03, B04, B07.'
  open_items:
    lead:
      zh: ''
      en: ''
    bullets:
    - zh: 无未决设计选择。切分正确率（合并、拆分错误）要在标注集上测（02 §9.2），等 V1。
      en: No open design choice. Split accuracy (merge / split errors) has to be measured on the labelled set (02 §9.2), after V1.
  completion_text:
    lead:
      zh: 已满足当前标准。V1 完成后补上切分正确率。
      en: current standard met. Add split accuracy after V1.
  criteria:
    target: dark_green
    method:
      zh: 合成数字写法集（已知切分答案，含开发集没有的写法）测覆盖和切分；V1 完成后在人工标注上测切分正确率
      en: a synthetic set of number phrasings with known segmentation (including phrasings absent from dev) for coverage and segmentation; after V1, segmentation accuracy on the human labels
    data:
      zh: 合成数据（独立样本）；V1 标注集（人工审核）
      en: synthetic data (independent sample); the V1 labelled set (human review)
    threshold:
      zh: 覆盖 100%；切分正确率 ≥ 98% `[建议，待确认]`
      en: coverage 100%; segmentation accuracy ≥ 98% `[suggestion, to be confirmed]`
    threshold_preset: false
  needs_b04:
    value: 'no'
    note:
      zh: 合成部分现在就能做；人工标注部分等 V1，不依赖 B04。
      en: The synthetic part can be done now; the labelled part waits for V1, not B04.
  deliverable_dir: docs/deliverables/B02-number-parse/
  test_report:
    zh: docs/deliverables/B02-number-parse/test_report.zh.md
    en: docs/deliverables/B02-number-parse/test_report.en.md
- id: B07
  column: W2
  tier: must
  plan_tasks:
  - P4a
  name:
    zh: 4-5 提交检查
    en: 4-5 Submission checks
  kind: build
  weight: 1
  color: yellow
  evidence_level: in_sample
  status_line:
    zh: '任务 14：提交检查不含任何与 Delta 的比较；检查不过才退回模型修正（最多 2 次）。撤 Delta 后，单个金额读错而模型不自报疑问的情形没有代码检查（第一段报告 2.1）。任务 23（审计 F-01）：`is_credit` 必须有原文依据：标成贷记、却没有贷记词、括号或紧贴的负号，强制检查不过，退回模型；读成正数、但证据短语里有贷记词或金额带括号，打 attention 标识；只有紧贴负号的不打（连字符分隔符）。在任务 19、20 的存档读法上重放（908 + 564 + 122 条），两条规则都是 0 条。任务 23b（审计复查 F-01）：贷记词只在这笔金额的本地范围（前一个数字到后一个数字之间）才算，不再看证据短语任意位置；计入的明细金额前有紧贴负号、本地没有贷记词也没有括号的，不论读成正负都打 attention 标识 `NUM.JUDGMENT.CREDIT_MINUS_UNCLEAR` 送人工；带空格的短横线不算依据、不打标识。复查的全部复现写成测试。同样重放：拒绝 0、0、0；因紧贴负号送人工 2、6、0 条（其中原来放行的 1、3、0）；因本地贷记词或括号送人工 0、0、0。任务 23c：本地范围只按像金额的数字（带 `$` 或恰好两位小数，由代码看数字表判定）划界，编号、数量、重量、日期不再切断，`CREDIT MEMO 12345 $50.00` 读成正数送人工、读成贷记通过；同样重放，三份结果和 23b 逐条相同'
    en: 'Task 14: the submission checks contain no comparison with Delta; only a failed check goes back to the model for repair (at most twice). With Delta withdrawn, a single misread amount without a model-reported doubt has no code check (stage-1 report 2.1). Task 23 (audit F-01): `is_credit` needs support in the text: a credit with no credit word, parentheses or minus sign directly before the number fails a mandatory check and goes back to the model; a positive reading whose evidence has a credit word, or whose amount is in parentheses, gets an attention flag; a minus sign alone raises nothing (dash separators). Replayed on the stored readings of tasks 19 and 20 (908 + 564 + 122): 0 hits for either rule. Task 23b (audit F-01 recheck): a credit word counts only in the amount''s local scope (from the previous number to the next one), no longer anywhere in the evidence phrase; a counted item with a minus sign directly before it and no local credit word or parentheses gets the attention flag `NUM.JUDGMENT.CREDIT_MINUS_UNCLEAR` (sent to a person) whichever way it was read; a spaced dash is no support and raises nothing. Every repro in the recheck is a test. Same replay: refused 0, 0, 0; to a person for an adjacent minus 2, 6, 0 (previously passed 1, 3, 0); for a local credit word or parentheses 0, 0, 0. Task 23c: the local scope is bounded only by money-like numbers (a `$` or exactly two decimals, judged by code from the number table); references, quantities, weights and dates no longer cut it, so `CREDIT MEMO 12345 $50.00` read as positive goes to a person and read as a credit passes. Same replay: identical to 23b, number by number'
  summary:
    claim:
      zh: '提交检查的逻辑在合成用例和 02 第 8 节走例上表现符合预期；任务 09 以来 `DOLLAR_EXCLUDED` 覆盖所有没计入的 `$` 金额，`reconcile` 已删。'
      en: 'The submission checks behave as expected on the synthetic cases and the walk-through of 02 section 8; since task 09 `DOLLAR_EXCLUDED` covers every uncounted ''$'' amount and `reconcile` is gone.'
    tested:
      zh: '`scratch/prototype/prototype_checks.py` 的 17 个合成用例；02 第 8 节 10 条走例（第 3 步是扮演的）。'
      en: The 17 synthetic cases in `scratch/prototype/prototype_checks.py`; the 10 walk-throughs of 02 §8 (step 3 role-played).
    data:
      zh: 合成用例是和代码一起开发时写的，算样本内；没有在开发集全量上跑过（需要模型输出）。
      en: The synthetic cases were written together with the code, so they count as in-sample; never run on the full dev split (needs model output).
    result_vs_threshold:
      zh: 任务 03 重跑 17 个全过（只记在看板里，没有单独的结果文件）。门槛未事先设定。
      en: Task 03 reran the 17 and all passed (recorded only on the board; no separate result file). Threshold not set in advance.
    limits:
      zh: '撤掉 Delta 后，单个金额读错而模型不自报疑问的情形没有代码检查。'
      en: 'Without Delta, a single misread amount the model does not report is not caught by any code check.'
  what_is:
    lead:
      zh: 在 `submit_line_items` 内部检查模型的提交：结构、引用、短语、单位冲突、对账、税、合计。"模型能改的错"退回给模型重试，"数据本身的问题"只记录。
      en: 'checks inside `submit_line_items`: structure, references, phrases, unit conflicts, reconciliation, tax, totals. "Errors the model can fix" go back to the model to retry; "problems in the data itself" are only recorded.'
  status_detail:
    lead:
      zh: 代码 `scratch/prototype/checks.py`、`tools.py`。只跑过 `prototype_checks.py` 的 17 个合成用例（任务 03 重跑 17 个全过）和 02 第 8 节走例（02 §7.1）。两处已知问题：
      en: 'code `scratch/prototype/checks.py`, `tools.py`. Only run on the 17 synthetic cases in `prototype_checks.py` (task 03 reran them: 17 pass) and the walk-throughs of 02 §8 (02 §7.1). Two known issues:'
    bullets:
    - zh: '`NUM.JUDGMENT.DOLLAR_EXCLUDED` 只在带 `$` 的金额被判为非金额或状态为 `NONE` 时触发（`checks.py` 第 300 行），没覆盖被判为已开票、已付、已扣状态的金额。'
      en: '`NUM.JUDGMENT.DOLLAR_EXCLUDED` fires only when a `$` amount is judged non-money or given status `NONE` (`checks.py` line 300); amounts judged billed, paid or deducted are not covered.'
    - zh: '`tools.py` 第 214 行 `reconcile` 的对账容差写死为 `Decimal("0.005")`，没从 `rules.yaml` 的 `tolerances.amount_abs` 读（`checks.py` 本身是从 `rules.yaml` 读的）。'
      en: '`tools.py` line 214 hard-codes the `reconcile` tolerance as `Decimal("0.005")` instead of reading `tolerances.amount_abs` from `rules.yaml` (`checks.py` itself does read it from `rules.yaml`).'
  deliverable_note:
    lead:
      zh: 变浅绿需要：两处问题修好后的合成用例结果，加上在开发集全量真实模型运行中退回、只记录各类诊断的触发统计 `[建议，待确认]`。
      en: 'to turn light green: synthetic-case results after both fixes, plus trigger statistics of the return and record-only diagnostics in a full real-model dev run `[suggestion, to be confirmed]`.'
  start_conditions:
    lead:
      zh: 修两处问题可以随时开始，但按任务规则需要我批准改原型代码，或在 D1 迁入 `src/` 时一起修 `[建议，待确认]`；全量检验需要 B04。
      en: the two fixes can start any time, but under the task rules changing prototype code needs my approval, or they can be done during D1's move into `src/` `[suggestion, to be confirmed]`; full validation needs B04.
  approach:
    lead:
      zh: ''
      en: ''
    bullets:
    - zh: 决定 `DOLLAR_EXCLUDED` 对已开票、已付、已扣状态的处理（见 7），再改检查和合成用例（02 D6）。
      en: Decide how `DOLLAR_EXCLUDED` treats billed / paid / deducted (see 7), then change the check and synthetic cases (02 D6).
    - zh: '`reconcile` 的容差改为从 `rules.yaml` 读，与 `checks.py` 一致（02 §5.3：阈值在配置里，不在代码里）。'
      en: 'Read the `reconcile` tolerance from `rules.yaml`, consistent with `checks.py` (02 §5.3: thresholds live in configuration, not code).'
    - zh: 在 B04 的全量运行上统计退回次数、原样重提、`PASSED_AFTER_RETURN`（02 §4.2、D5、D6）。
      en: In B04's full run, count returns, unchanged resubmissions and `PASSED_AFTER_RETURN` (02 §4.2, D5, D6).
    - zh: 对照 02 §7.3 的代理类别 A-D 检查对账结果 `[建议，待确认]`。
      en: Check reconciliation outcomes against 02 §7.3's proxy classes A-D `[suggestion, to be confirmed]`.
  depends:
    lead:
      zh: 前置：B02、B06、C1、C2。被依赖：B04（提交出口）、B08、B09。
      en: 'depends on: B02, B06, C1, C2. Needed by: B04 (submission exit), B08, B09.'
  open_items:
    lead:
      zh: ''
      en: ''
    bullets:
    - zh: 与 2026-11-04 决定不一致，待改：合计算两次仍是门槛（决定 3.4）；算式引用可选（3.3）；防凑数没覆盖全部状态（3.5）；`contains_number` 仍在（3.8）；费用代码依据没有别名核对（3.6）。颜色保持黄。
      en: 'Conflicts with the 2026-11-04 decisions, to revise: total-counted-twice is still a gate (decision 3.4); arithmetic references are optional (3.3); anti-padding does not cover every status (3.5); `contains_number` is still there (3.8); charge-code evidence has no alias check (3.6). Colour stays yellow.'
    - zh: '`DOLLAR_EXCLUDED` 是否扩到已开票、已付、已扣状态——由我决定。注意：02 §7.3 把付款历史里留出的已付、已开票金额视为"不打 flag"，扩大覆盖会把这 5 条一起送去人工，要先定规则（02 §7.3、D6）。'
      en: 'Whether `DOLLAR_EXCLUDED` should cover billed / paid / deducted — decided by me. Note: 02 §7.3 treats paid or billed amounts left out in payment-history texts as "no flag"; widening coverage would send those 5 events to human review too, so the rule has to be settled first (02 §7.3, D6).'
    - zh: '`DOLLAR_EXCLUDED` 设为单独即转人工（约 1% 转人工）是否接受——由我决定（02 §10.1-4）。'
      en: Whether `DOLLAR_EXCLUDED` alone escalating (about 1% human review) is acceptable — decided by me (02 §10.1-4).
  completion_text:
    lead:
      zh: 两处问题修好；在开发集全量真实模型运行上跑过；有交付物 `[建议，待确认]`。
      en: both issues fixed; run on a full real-model dev run; deliverable exists `[suggestion, to be confirmed]`.
  criteria:
    target: light_green
    method:
      zh: 两处问题修好后重跑合成用例，并在开发集全量真实模型运行上统计各诊断触发次数
      en: rerun the synthetic cases after fixing the two issues, and count each diagnostic over a real-model run on the full dev split
    data:
      zh: 合成用例；开发集全量
      en: synthetic cases; full dev split
    threshold:
      zh: 未设定，开始检验前写入
      en: not set; to be written before the check runs
    threshold_preset: false
  needs_b04:
    value: 'yes'
    note:
      zh: 两处修复和合成用例现在能做；开发集全量运行要 B04。
      en: The two fixes and synthetic cases can be done now; the full dev run needs B04.
  test_report:
    zh: docs/deliverables/B07-submit-checks/test_report.zh.md
    en: docs/deliverables/B07-submit-checks/test_report.en.md
- id: B10
  column: W2
  tier: must
  plan_tasks:
  - P5
  name:
    zh: 7 输出
    en: 7 Outputs
  kind: build
  weight: 1
  color: yellow
  evidence_level: in_sample
  status_line:
    zh: '任务 20：每次运行写读法层（`records.jsonl`，带 `schema_version`）、票货层（`shipments.jsonl`）、客户格式票货表（`shipment_table.csv`、`.json`）、SQLite（含 `shipment_result`、`shipment_line`）和两份导出；接口说明 `docs/reading_output_contract.md`、`docs/shipment_output_contract.md`；干净检出上用合成样例跑通。下游导出不再要求“与 Delta 一致”。原来的 11 项结构检查还没按新格式重写，所以仍是黄。任务 23（审计 F-03）：两份接口说明列出到第二层的每个字段，每个标明稳定接口或诊断信息（模型调用记录等属诊断信息），测试比对实际输出的字段集合和说明，多一个或少一个都失败；证据短语写明按忽略大小写和空白匹配（F-05）'
    en: 'Task 20: every run writes the reading output (`records.jsonl`, with `schema_version`), the shipment output (`shipments.jsonl`), the client-format shipment table (`shipment_table.csv`, `.json`), SQLite (including `shipment_result`, `shipment_line`) and the two exports; contracts in `docs/reading_output_contract.md` and `docs/shipment_output_contract.md`; run end to end on the synthetic batch from a clean checkout. The downstream export no longer requires agreement with Delta. The 11 structural checks have not been rewritten for the new format, so it stays yellow. Task 23 (audit F-03): both contracts list every field to the second level, each marked stable or diagnostic (the model transcript and the like are diagnostic); a test compares the fields of real output with the list and fails on any extra or missing field; phrase matching stated as case- and whitespace-insensitive (F-05)'
  summary:
    claim:
      zh: '每次运行写读法层、票货层、客户格式票货表和 SQLite，下游用到的字段写在两份接口说明里。'
      en: 'Every run writes the reading output, the shipment output, the client-format shipment table and SQLite; the fields downstream steps use are described in two contracts.'
    tested:
      zh: 11 项结构检查：schema 读回、ID 唯一、事件数对账、Excel 两张表、`Dispute Status` 只在 Excel。
      en: '11 structural checks: schema read-back, unique IDs, event-count reconciliation, two Excel sheets, `Dispute Status` only in Excel.'
    data:
      zh: 开发集全量 908 条事件，只跑代码部分，没有第 3 步。
      en: Full dev split, 908 events, code-only, no step 3.
    result_vs_threshold:
      zh: 11 / 11 通过。门槛未事先设定。
      en: 11 / 11 pass. Threshold not set in advance.
    limits:
      zh: '11 项结构检查没按新格式重写；票货表只按客户两个例子核对过，客户没看过导出文件；没有 Excel 输出和事件日志。'
      en: 'The 11 structural checks are not rewritten for the new format; the shipment table is checked only against the client''s two examples and the client has not seen an exported file; no Excel output and no event log.'
  what_is:
    lead:
      zh: 把每条争议的结果写成记录对象 JSON、追加式事件日志和 Excel（records、flags 两张表）。`Dispute Status` 只在导出 Excel 时关联回去。
      en: writes each dispute's result as record-object JSON, an append-only event log and Excel (two sheets, records and flags). `Dispute Status` is joined back only at Excel export.
  status_detail:
    lead:
      zh: 代码 `scratch/prototype/schemas.py`（`Record`、`Event`）、`run_dev.py` 第 5 节。任务 03 重跑 `scratch/deliverables/B10_outputs.py`，在 908 条上生成三种输出并按 schema 读回，11 项检查全过。限制：没有第 3 步，`llm_input`、`content`、`claim` 全为空；事件日志只写 3 种事件类型；Excel 格式未经客户看过。
      en: 'code `scratch/prototype/schemas.py` (`Record`, `Event`), section 5 of `run_dev.py`. Task 03 reran `scratch/deliverables/B10_outputs.py`: the three outputs generated for 908 events and read back against the schema; all 11 checks pass. Limits: without step 3, `llm_input`, `content` and `claim` are empty; the event log writes only 3 event types; the Excel layout has not been reviewed by the client.'
  deliverable_note:
    lead:
      zh: '`docs/deliverables/B10-outputs/`：三种输出的结构校验和一条记录对象的结构示例（标识字段已隐去）。'
      en: '`docs/deliverables/B10-outputs/`: structural validation of the three outputs and the structure of one record object (identifying fields withheld).'
  start_conditions:
    lead:
      zh: 已完成当前范围。B04 跑通后需要用真实内容重跑。
      en: done for the current scope. Rerun with real content once B04 runs.
  approach:
    lead:
      zh: （已完成，记录做法）：记录对象按 02 §2.5 的结构；事件日志追加式（02 §2.5）；`Dispute Status` 只在导出时按记录关联（02 D7）；Excel 两张表（02 §1.2）。
      en: '(done, recorded): record object per 02 §2.5; append-only event log (02 §2.5); `Dispute Status` joined only at export (02 D7); two Excel sheets (02 §1.2).'
  depends:
    lead:
      zh: 前置：B09。被依赖：D1、F2。
      en: 'depends on: B09. Needed by: D1, F2.'
  open_items:
    lead:
      zh: ''
