  depends:
    lead:
      zh: 前置：V1、C3。被依赖：B04。
      en: 'depends on: V1, C3. Needed by: B04.'
  open_items:
    lead:
      zh: ''
      en: ''
    bullets:
    - zh: 任务 19 已删掉全部和 Delta 比较、`inconsistent` 回执的文字；第四轮 mock 和预留 mock 还没有在新版本上跑（独立检验，深绿要它）。
      en: 'Task 19 removed every mention of the Delta comparison and the ''inconsistent'' receipt; the 4th mock round and the reserved mock have not been run on the new version (independent check, needed for dark green).'
    - zh: 选哪些例子——由团队决定 `[建议，待确认]`。
      en: Which examples — decided by the team `[suggestion, to be confirmed]`.
    - zh: 是否"先分类再抽取"——由实验 E6 的结果决定，团队执行（02 §9.4）。
