owner_actions:
- 把问题清单发给 Jake（J01）：10 个问题已写好，英文部分可以整段发。
- 安排两到三位组员做标注（H2a）：三个标注包已用最终的脱敏方式重新生成，每包 45 条、约 2 小时。
- 验收第一段和第二段已做的 16 项任务：你说验收了，状态才从“已做待验收”改成“已验收”。
- 定默认脱敏方式（P-20）：现在按事先的规则用白名单，有两个副作用（没见过的费用词会被遮住；模型报告注入的次数变少）；备选是退回公开人名表。定了之后才用最终版本重跑开发集全量（P-23，约 10 美元）。
- 看护栏开和关的结论（P-21、P-22）：注入这一条没达到事先写的门槛（标出 22 个，门槛 27 个）；护栏的作用是让错误被看见，不是提高读对率。要不要加强注入检查、展示里怎么讲，由你定。
- 确认看板上三处标着“建议，待确认”的分母口径：A1 到 A3 不进分母、F2 不进分母、V2 卡复用为护栏对比。
- 定审核界面的“批准”按钮要不要改名（P-24），以及标注包“同一种模板最多 2 条”的上限要不要放宽（P-25）。
- 定 mock 预期由谁改（M1，mock 归另一个代理维护）；中期汇报（D1）和期末展示（D2）由你和组员准备。
next_leg:
  name: 第三段
  assume_done: [M1, H2a, H3, J01]
  note: 假设下一段 CC 做 M1 和 H3，人工一侧把标注（H2a）做完、Jake 的问题发出并回填（J01）。这是假设，不是承诺；H3 要等 H2a 的标注结果，J01 要等 Jake 回答。
ledger:
  path: docs/autorun/budget_ledger.jsonl
  leg1_last_run_contains: frep3
  margin: 0.4
  # 每条花费的依据：从账本里取这些运行，花费除以条数
  rates:
    dev_full: {runs: [devFull], note: 开发集全量 953 条}
    dev_sample: {runs: [rdAallowlist-, rdBallowlist-], note: 开发集样本 A、B2 各 100 条，最终版本}
    mock: {runs: [finalMock], note: 公开 mock 375 行，最终版本}
  forecast:
  - {when: next, name: 标注集跑一遍（三个包里的不同记录）, records: 105, rate: dev_sample}
  - {when: next, name: M1 改完后公开 mock 再跑一遍, records: 375, rate: mock}
  - {when: next, name: 默认脱敏方式定下之后（P-20），最终版本重跑开发集全量（P-23）, records: 953, rate: dev_full}
  - {when: next, optional: true, name: 如果默认脱敏方式退回人名表（P-20），A、B2、mock 各重跑一遍, records: 575, rate: mock}
  - {when: next, optional: true, name: V3b 给模型 Delta 的一组（如果选做）：A 加公开 mock, records: 475, rate: mock}
  - {when: later, name: V4 测试集终测，只跑一次, records: 400, rate: dev_sample}
  - {when: later, name: 预留 mock 批次评分一次（行数未知，按公开 mock 的 375 行估）, records: 375, rate: mock}
  - {when: later, name: 演示和彩排用的小样本运行, records: 100, rate: dev_sample}
