# docs/status/progress.yaml — 进度文件的数据源（任务 10 第 2 节）
#
# 一行一个 Must 任务（11 月 5 日计划 docs/plan/2026-11-05_workload_v2.zh.md 第 3 节的 23 项）。
# 只改这个文件，然后运行：
#   uv run python scratch/plan/progress.py --write            # 重新生成 docs/status/progress.zh.md，并打印停点汇报的开头几行
#   uv run python scratch/plan/progress.py --write --cc-session <会话 .jsonl>   # 同时统计 Claude Code 自己的消耗
#   sh scratch/status/run.sh                                  # 状态板的“Must 清单”表也读这个文件，改完要重新生成
#
# 字段
#   id         计划里的任务编号
#   name       任务名 {zh, en}
#   hours      计划的人时区间 [低, 高]；工时中值 = 两者的中点
#   plan_mode  计划 5.1 的口径：cc = 写代码为主，human = 按人工估（与 scratch/plan/workload_v2.py 的 mode 相同）
#   owner      负责方：CC 或 人工。规则见 meta.owner_rule
#   status     未做 | 已做待验收 | 已验收。“已验收”只有项目负责人说了才能写
#   leg        在哪一段做的（1 = 任务 09，2 = 任务 10）；没做的不写
#   why        为什么是这个状态（对照计划里的完成标准）
#
meta:
  updated: '2026-11-10'
  plan: docs/plan/2026-11-05_workload_v2.zh.md
  owner_rule: '默认取计划 5.1 的口径（写代码为主的归 CC，按人工估的归人工，依据是计划 1.2 节）。例外只有一类：计划按人工估、但完成标准要求的产出实际已由 CC 在自主运行里做出来的任务（S1、H1、U1、K1），负责方记 CC，并在 plan_mode 里保留计划原来的口径。仍归人工的是必须由人来做的事：人工标注（H2a）、测试集终测（V4，读测试集要项目负责人亲自打开开关）、和 Jake 沟通（J01）、汇报和彩排（D1、D2）。'
  status_rule: '计划里写的完成标准满足了才算“已做”；只做了一部分的记“未做”，并在 why 里写明已经有什么。第一段和第二段做完的任务都是“已做待验收”，项目负责人说验收了才改成“已验收”。'
  credit:
    已验收: 1.0
    已做待验收: 0.7
    未做: 0.0
