# 诊断类型目录 v0.1。按对象组织：代码前缀 = 对象类别，第二段 = 子类，第三段 = 具体类型（类似异常类层级）。
# step 只是属性。handling: return = 写进修复回执退回模型；record = 只记录。
# carrier_fix / acceptance 为空表示这不是承运商能改的问题（系统或数据侧），不会进入打回通知。
# 严重程度与转人工作用不在这里，在 rules.yaml。
version: catalog-v0.1

REC.INPUT.EXPORT_DUPLICATE:
  object: 记录
  trigger: 多行在 (shipment, Event Date, 文本, Invoice Amount, Delta) 上完全相同，被合并为一条
  evidence: "{n_rows, source_rows, pks}"
  step: "1"
  handling: record
  reviewer: 无需处理；统计时按合并后的一条计
  carrier_fix: null
  acceptance: null

REC.TEXT.EMPTY:
  object: 记录
  trigger: 说明文本为空或只有空白
  evidence: "{text_length}"
  step: "1"
  handling: record
  reviewer: 没有任何可拆分内容
  carrier_fix: 补充说明：写明每一项费用的名称和金额，以及收费原因
  acceptance: 文本至少包含一个费用名称和一个金额，且列出的金额之和等于本次差额

REC.TEXT.NUMBERS_ONLY:
  object: 记录
  trigger: 文本去掉数字、日期、标点后没有任何字母
  evidence: "{text, numbers}"
  step: "2"
  handling: record
  reviewer: 金额没有名称；若同一票货更早有同 Delta 的完整说明，参照该记录
  carrier_fix: 写明这笔金额对应的费用名称和收费原因
  acceptance: 每个金额旁边都有费用名称；金额之和等于本次差额

REC.TEXT.NO_NUMBER:
  object: 记录
  trigger: 文本有文字但没有任何数字（如 "PURCHASED TRANSPORTATION SURCHARGE --"）
  evidence: "{text}"
  step: "2"
  handling: record
  reviewer: 有费用名称没有金额，无法对账
  carrier_fix: 写明该项费用的金额
  acceptance: 每个费用名称都有对应金额，金额之和等于本次差额

REC.TEXT.INJECTION_SUSPECT:
  object: 记录
  trigger: 文本命中 rules.yaml 中的指令式模式，或含不可打印字符、超长
  evidence: "{patterns_hit, length}"
  step: "1"
  handling: record
  reviewer: 文本可能试图影响自动处理；人工阅读原文
  carrier_fix: null
  acceptance: null

REC.TEXT.PII_REDACTED:
  object: 记录
  trigger: 脱敏替换了人名或邮箱
  evidence: "{n_person, n_email}（不含原值）"
  step: "1"
  handling: record
  reviewer: 无需处理；导出时可在本地还原
  carrier_fix: null
  acceptance: null

REC.TEXT.REDACTION_ALTERED_DIGITS:
  object: 记录
  trigger: 脱敏前后文本的数字字符序列不同（脱敏误删了数字）
  evidence: "{digits_before_count, digits_after_count}"
  step: "1"
  handling: record
  reviewer: 脱敏影响了金额，拆分结果不可信
  carrier_fix: null
  acceptance: null

REC.TEXT.DATE_AFTER_EVENT:
  object: 记录
  trigger: 文本中带年份的日期晚于 Event Date 超过 1 天
  evidence: "{latest_text_date, event_date, days_after}"
  step: "2"
  handling: record
  reviewer: 文本可能在 Event Date 之后写成或改过；历史比对的时间顺序要谨慎看待
  carrier_fix: null
  acceptance: null

REC.FIELD.DELTA_ZERO:
  object: 记录
  trigger: Delta 为 0
  evidence: "{delta}"
  step: "1"
  handling: record
  reviewer: 没有对账锚点，拆分无法用 Delta 验证；文本可能是费率、批准额或结案说明
  carrier_fix: null
  acceptance: null

REC.FIELD.DELTA_NEGATIVE:
  object: 记录
  trigger: Delta 小于 0（承运商开票低于计划金额）
  evidence: "{delta}"
  step: "1"
  handling: record
  reviewer: 这不是多收，按文本核对承运商在说什么
  carrier_fix: null
  acceptance: null

REC.FIELD.CROSS_BORDER:
  object: 记录
  trigger: 起点和终点国家不同
  evidence: "{origin_country, destination_country}"
  step: "1"
  handling: record
  reviewer: 税的适用规则可能不同（零税率等，待确认）
  carrier_fix: null
  acceptance: null

REC.FIELD.REASON_CODE_CONFLICT:
  object: 记录
  trigger: Reason Code 映射到一个具体类别（rules.yaml 映射表），模型给出的费用代码也属于具体类别，且两者不同
  evidence: "{reason_code, reason_category, model_categories}"
  step: 6a
  handling: record
  reviewer: 结构化编码和文本内容不一致；以文本为准，编码问题用于统计
  carrier_fix: null
  acceptance: null

NUM.PARSE.UNRECOGNIZED_REGION:
  object: 数字
  trigger: 有数字字符没有被数字或日期规则认领（如 "CV19"）
  evidence: "{region_id, raw, span}"
  step: "2"
  handling: record
  reviewer: 该处由模型解读，解读值已与原文数字字符精确比对
  carrier_fix: null
  acceptance: null

NUM.PARSE.SPACE_MERGED:
  object: 数字
  trigger: 数字由空格分隔的数字组合并而成（"1 684.68"）
  evidence: "{id, raw, value}"
  step: "2"
  handling: record
  reviewer: 合并是规则推断，可能本应是两个数
  carrier_fix: null
  acceptance: null

NUM.PARSE.UNUSUAL_DECIMALS:
  object: 数字
  trigger: 小数位不是 0、1、2（"33.744 LBS"）
  evidence: "{id, raw, decimals}"
  step: "2"
  handling: record
  reviewer: 点可能是千分位
  carrier_fix: null
  acceptance: null

NUM.PARSE.LEADING_DOT:
  object: 数字
  trigger: 以点开头的小数（".73"）
  evidence: "{id, raw}"
  step: "2"
  handling: record
  reviewer: 常见于费率
  carrier_fix: null
  acceptance: null

NUM.PARSE.MINUS_ADJACENT:
  object: 数字
  trigger: 数字或 $ 紧贴一个减号（"-250"、"-$ 400.00"）
  evidence: "{id, raw}"
  step: "2"
  handling: record
  reviewer: 减号可能是负号，也可能是分隔符
  carrier_fix: null
  acceptance: null

NUM.REF.UNKNOWN_ID:
  object: 数字
  trigger: 提交中引用了编号表里没有的编号
  evidence: "{given, valid_ids}"
  step: 4-5
  handling: return
  reviewer: null
  carrier_fix: null
  acceptance: null

NUM.REF.DUPLICATE_ID:
  object: 数字
  trigger: 同一编号被判断了不止一次
  evidence: "{id, count}"
  step: 4-5
  handling: return
  reviewer: null
  carrier_fix: null
  acceptance: null

NUM.REF.MISSING_ID:
  object: 数字
  trigger: 编号表中有编号没有被判断
  evidence: "{missing_ids}"
  step: 4-5
  handling: return
  reviewer: null
  carrier_fix: null
  acceptance: null

NUM.JUDGMENT.STATUS_ON_NON_MONEY:
  object: 数字
  trigger: kind 为 RATE、QUANTITY、REFERENCE 却给了 NONE 以外的 status
  evidence: "{id, kind, status}"
  step: 4-5
  handling: return
  reviewer: null
  carrier_fix: null
  acceptance: null

NUM.JUDGMENT.UNIT_CONFLICT:
  object: 数字
  trigger: 判为金额类 kind 的数字紧跟重量、百分比、天数等单位词
  evidence: "{id, kind, unit_hint}"
  step: 4-5
  handling: return
  reviewer: null
  carrier_fix: null
  acceptance: null

NUM.JUDGMENT.EVIDENCE_NOT_FOUND:
  object: 数字
  trigger: evidence_phrase 在脱敏原文中找不到（精确匹配和容忍空格、大小写的匹配都失败）
  evidence: "{id, phrase}"
  step: 4-5
  handling: return
  reviewer: null
  carrier_fix: null
  acceptance: null

NUM.JUDGMENT.DOLLAR_EXCLUDED:
  object: 数字
  trigger: 带 $ 的数字被判为非金额 kind，或金额 kind 但 status 为 NONE；判为 RATE 且有单价线索（@、AT、EACH、PER、A DAY，见 rules.yaml）的不算
  evidence: "{id, raw, kind, status}"
  step: 4-5
  handling: record
  reviewer: 一个写了 $ 的金额没有计入本次主张；核对这个排除是否合理（可能是为了凑 Delta）
  carrier_fix: null
  acceptance: null

NUM.JUDGMENT.SPACE_MERGED_IN_CLAIM:
  object: 数字
  trigger: 由空格合并出来的数字被计入本次主张
  evidence: "{id, raw, value}"
  step: 4-5
  handling: record
  reviewer: 计入的金额来自推断性的合并，核对原文
  carrier_fix: 金额不要用空格分隔千位
  acceptance: 金额写成连续数字（如 8400.00）

NUM.READ.UNRECOGNIZED_MISMATCH:
  object: 数字
  trigger: 模型对未识别区域给出的值，去掉非数字字符后与原文该区域的数字字符不相等
  evidence: "{region_id, raw_digits, given_digits}"
  step: 4-5
  handling: return
  reviewer: null
  carrier_fix: null
  acceptance: null

NUM.READ.UNRECOGNIZED_UNREAD:
  object: 数字
  trigger: 有未识别区域没有给出解读
  evidence: "{region_ids}"
  step: 4-5
  handling: return
  reviewer: null
  carrier_fix: null
  acceptance: null

ITEM.CODE.UNKNOWN:
  object: line item
  trigger: 费用代码不在 taxonomy 中
  evidence: "{path, code}"
  step: 4-5
  handling: return
  reviewer: null
  carrier_fix: null
  acceptance: null

ITEM.CODE.OTHER_PHRASE_MISSING:
  object: line item
  trigger: 使用 OTHER 但没有 other_phrase，或 other_phrase 不在原文中
  evidence: "{path, other_phrase}"
  step: 4-5
  handling: return
  reviewer: null
  carrier_fix: null
  acceptance: null

ITEM.CODE.OTHER:
  object: line item
  trigger: 费用代码为 OTHER
  evidence: "{path, other_phrase}"
  step: 4-5
  handling: record
  reviewer: 费用不在代码表中，人工确认名称；同时是扩充代码表的候选
  carrier_fix: 使用标准费用名称
  acceptance: 费用名称属于 PPG 认可的费用清单

ITEM.CODE.PENDING_MEANING:
  object: line item
  trigger: 费用代码属于 PENDING 类（purchase(d) transportation）
  evidence: "{path, code}"
  step: 4-5
  handling: record
  reviewer: 这项费用的含义和计费方式尚未确认，拆分只能说明"承运商收了这一项"
  carrier_fix: null
  acceptance: null

ITEM.CODE.COMBINED:
  object: line item
  trigger: 一个金额对应多个费用代码
  evidence: "{path, codes, amount}"
  step: 4-5
  handling: record
  reviewer: 金额无法拆到各项；不要自行按惯例拆分
  carrier_fix: 每项费用分别列出金额
  acceptance: 每个费用名称各有一个金额，金额之和等于本次差额

ITEM.REF.CLAIM_NOT_ITEMIZED:
  object: line item
  trigger: status 为 CLAIMED 或 UNPAID 的非合计金额没有被任何 line item 引用
  evidence: "{ids}"
  step: 4-5
  handling: return
  reviewer: null
  carrier_fix: null
  acceptance: null

ITEM.REF.INVALID:
  object: line item
  trigger: line item 引用了不存在的编号、非金额编号、非计入状态的编号，或同一编号被多个 line item 引用
  evidence: "{path, amount_ref, reason}"
  step: 4-5
  handling: return
  reviewer: null
  carrier_fix: null
  acceptance: null

ITEM.PHRASE.NOT_FOUND:
  object: line item
  trigger: carrier_stated_reason、carrier_stated_basis 或 other_phrase 在原文中找不到
  evidence: "{path, field, phrase}"
  step: 4-5
  handling: return
  reviewer: null
  carrier_fix: null
  acceptance: null

ITEM.AMOUNT.MISSING:
  object: line item
  trigger: 一个非税的费用被提到但没有金额（amount_ref 为空）
  evidence: "{path, codes}"
  step: 4-5
  handling: record
  reviewer: 有费用名没有金额，这一项无法对账
  carrier_fix: 写明该项费用的金额
  acceptance: 每个费用名称都有金额

ITEM.AMOUNT.UNNAMED:
  object: line item
  trigger: 计入本次主张的金额没有任何费用代码
  evidence: "{path, amount_ref, amount}"
  step: 4-5
  handling: record
  reviewer: 这笔钱没有写明是什么费用；不要按 Reason Code 或惯例补名称
  carrier_fix: 写明这笔金额对应的费用名称
  acceptance: 每个金额旁边都有费用名称

ITEM.TAX.NO_AMOUNT:
  object: line item
  trigger: 文本提到税（"+ HST"）但没有写税额；代码按 Delta 与其他金额之差算出隐含税额
  evidence: "{path, implied_tax, expected_tax, province}"
  step: 4-5
  handling: record
  reviewer: 税额是代码推算的，不是原文金额；推算值为 0 表示 Delta 没有包含税
  carrier_fix: 写明税额
  acceptance: 税种和税额都写出，税额与适用税率一致

ITEM.TAX.RATE_MISMATCH:
  object: line item
  trigger: 税额（原文的或推算的）与税率表按基数计算的结果相差超过容差
  evidence: "{path, base, tax, implied_rate, expected_rate, province}"
  step: 4-5
  handling: record
  reviewer: 税额与该省税率不符，核对适用省份和基数
  carrier_fix: 按适用税率重新计算税额
  acceptance: 税额 = 基数 × 适用税率（误差不超过 1 分）

ITEM.TAX.NO_RULE:
  object: line item
  trigger: 提到税，但适用省份没有税率规则（非加拿大，或 PST/QST 是否适用于运费未定）
  evidence: "{path, province, tax_codes}"
  step: 4-5
  handling: record
  reviewer: 税额未经检查
  carrier_fix: null
  acceptance: null

ITEM.BASIS.PPG_CLAIMED:
  object: line item
  trigger: 依据类型为 PPG_NOTIFIED、PPG_APPROVED 或 PPG_LIST
  evidence: "{path, basis_type, basis}"
  step: 4-5
  handling: record
  reviewer: 承运商声称 PPG 通知、批准或有清单；需对照 PPG 内部记录核实，系统未核实
  carrier_fix: null
  acceptance: null

ITEM.BASIS.CONTRACT_CLAIMED:
  object: line item
  trigger: 依据类型为 CONTRACT_OR_TARIFF 或 SHIPPING_DOCUMENT
  evidence: "{path, basis_type, basis}"
  step: 4-5
  handling: record
  reviewer: 需对照合同、价目表或单据核实，系统未核实
  carrier_fix: null
  acceptance: null

ITEM.NATURE.RATE_CORRECTION:
  object: line item
  trigger: 费用代码属于 RATE_CORRECTION 类
  evidence: "{path, code}"
  step: 4-5
  handling: record
  reviewer: 主张的是费率或计费方式错误，金额是差额，需要合同才能核实
  carrier_fix: null
  acceptance: null

ITEM.ARITH.QTY_RATE_MISMATCH:
  object: line item
  trigger: line item 给出了数量和单价，数量 × 单价 ≠ 金额
  evidence: "{path, quantity, unit_rate, amount}"
  step: 4-5
  handling: record
  reviewer: 文本自己的算式不成立
  carrier_fix: 更正数量、单价或金额，使三者一致
  acceptance: 数量 × 单价 = 金额

CLAIM.RECON.SUM_MISMATCH:
  object: 主张汇总
  trigger: 计入状态的非合计金额之和（加上推算税额）≠ Delta，且不属于下面的数据型模式
  evidence: "{counted_ids, claimed_sum, delta, difference}"
  step: 4-5
  handling: return
  reviewer: 重试用完后见 RUN.SUBMIT.FAILED
  carrier_fix: 列出的金额之和要等于本次差额
  acceptance: 列出的金额之和等于本次差额

CLAIM.RECON.DELTA_COUNTS_TOTAL_TWICE:
  object: 主张汇总
  trigger: 文本写了合计（a + b = c），Delta = 各项 + 合计（即合计被算了两次；a + b = c 时 Delta = 2c 是其特例）
  evidence: "{claimed_sum, total, delta}"
  step: 4-5
  handling: record
  reviewer: 发票金额可能把同一组费用计了两次；拆分本身按文本给出
  carrier_fix: 发票金额只计一次合计
  acceptance: 本次差额等于文本合计

CLAIM.RECON.TOTAL_MISMATCH:
  object: 主张汇总
  trigger: 文本中的合计与计入金额之和（加推算税额）不一致
  evidence: "{total_id, total, claimed_sum, implied_tax}"
  step: 4-5
  handling: record
  reviewer: 文本自带的算式不成立
  carrier_fix: 更正合计或各项金额
  acceptance: 各项之和等于合计

CLAIM.RECON.PASSED_AFTER_RETURN:
  object: 主张汇总
  trigger: 对账在第 2 次或以后的提交才通过
  evidence: "{attempt, changed_fields}"
  step: 4-5
  handling: record
  reviewer: 模型改了判断才对上，看改动是否有原文依据
  carrier_fix: null
  acceptance: null

HIST.REPEAT.IDENTICAL_TEXT:
  object: 与同一票货其他记录的关系
  trigger: 更早的记录文本与 Delta 都相同
  evidence: "{earlier_record_id, minutes_between}"
  step: "5.5"
  handling: record
  reviewer: 同一主张重复提交
  carrier_fix: 不要重复提交同一争议
  acceptance: 同一费用只有一条未结争议

HIST.REPEAT.SAME_DELTA:
  object: 与同一票货其他记录的关系
  trigger: 更早的记录 Delta 相同、文本不同
  evidence: "{earlier_record_id}"
  step: "5.5"
  handling: record
  reviewer: 可能是补充说明，也可能换了名目；对照更早的记录
  carrier_fix: null
  acceptance: null

HIST.REPEAT.SAME_AMOUNT_NEW_CODES:
  object: 与同一票货其他记录的关系
  trigger: 更早的记录 Delta 相同，但两次的费用代码类别不相交（要用到模型输出）
  evidence: "{earlier_record_id, earlier_codes, codes}"
  step: "5.5"
  handling: record
  reviewer: 同一笔金额换了费用名目再提
  carrier_fix: 说明为什么同一金额改用了不同费用名称
  acceptance: 一笔金额只对应一个费用名称，并说明改动原因

HIST.REPEAT.REVISED_SAME_CHARGES:
  object: 与同一票货其他记录的关系
  trigger: 更早的记录 Delta 不同，但费用代码有交集（要用到两条记录的模型输出；税代码不算）
  evidence: "{earlier_record_id, earlier_delta, shared_codes}"
  step: "5.5"
  handling: record
  reviewer: 同一项费用改了金额再提，看本次是替换还是追加
  carrier_fix: 说明本次金额是替换还是追加更早的主张
  acceptance: 文本写明与更早争议的关系（替换或追加）及原因

HIST.AMOUNT.EQUALS_EARLIER_DELTA:
  object: 与同一票货其他记录的关系
  trigger: 本次计入的某个金额等于更早某条记录的 Delta，而本次 Delta 与那条不同
  evidence: "{id, amount, earlier_record_id, earlier_delta}"
  step: "5.5"
  handling: record
  reviewer: 本次文本重复列出了更早争议的金额，可能同一笔钱主张了两次
  carrier_fix: 只列出本次新增的金额，或说明与更早争议的关系
  acceptance: 本次列出的金额不包含已主张过的金额，或明确写出是替换哪一次

HIST.AMOUNT.NEAR_105_EARLIER:
  object: 与同一票货其他记录的关系
  trigger: 本次计入的某个金额约为更早某条记录 Delta 的 1.03 到 1.07 倍（阈值在 rules.yaml）
  evidence: "{id, amount, earlier_record_id, earlier_delta, ratio}"
  step: "5.5"
  handling: record
  reviewer: 金额像是更早金额加了约 5%（可能是 GST），但文本没有写税
  carrier_fix: 如含税，分别写出税前金额和税额
  acceptance: 税额单列，且与适用税率一致

HIST.ORDER.SAME_MINUTE_SIBLING:
  object: 与同一票货其他记录的关系
  trigger: 同一票货有另一条记录的 Event Date 与本条相同（精确到分钟），两者互相不可见
  evidence: "{sibling_record_id}"
  step: "5.5"
  handling: record
  reviewer: 两条同时提交，系统没有比较它们
  carrier_fix: null
  acceptance: null

HIST.CONTEXT.EARLIER_EXPLAINED:
  object: 与同一票货其他记录的关系
  trigger: 更早的记录 Delta 相同，且文本有费用名称（用于自动打回的豁免）
  evidence: "{earlier_record_id}"
  step: "5.5"
