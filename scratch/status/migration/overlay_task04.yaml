      stroke: "#1b5e20"
      text: "#ffffff"
      name: {zh: "深绿", en: "Dark green"}
      meaning: {zh: "验证通过：在独立样本或人工审核上，达到事先写定的门槛", en: "verified: meets a threshold written down in advance, on an independent sample or by human review"}
    grey:
      emoji: "⬜"
      fill: "#e6e6e6"
      stroke: "#777777"
      text: "#333333"
      name: {zh: "灰", en: "Grey"}
      meaning: {zh: "仓库里没有依据，由我本人维护", en: "no basis in the repository; maintained by me personally"}
  evidence_levels:
    none:
      name: {zh: "无", en: "none"}
      meaning: {zh: "还没有检验", en: "not tested yet"}
    in_sample:
      name: {zh: "样本内", en: "in-sample"}
      meaning: {zh: "用开发这部分时看过的同一批数据检验", en: "tested on the same data that was looked at while developing this part"}
    independent:
      name: {zh: "独立样本", en: "independent sample"}
      meaning: {zh: "用开发时没看过的数据检验，例如合成注入的测试数据", en: "tested on data not seen during development, e.g. synthetic injected test data"}
    human_review:
      name: {zh: "人工审核", en: "human review"}
      meaning: {zh: "由写代码以外的人抽样核对，或在测试集终测中检验", en: "spot-checked by someone other than the author of the code, or tested in the final test-set run"}
  rules:
    zh:
      - "浅绿要求至少样本内证据和交付物；深绿要求独立样本或人工审核证据，并且达到门槛。"
      - "门槛必须在跑检验之前写进卡片的\"完成标准\"。现有检验如果当时没有事先定门槛，测试报告里如实写\"门槛未事先设定\"，这样的结果不能用来标深绿。"
      - "分析类卡片（A2 问题盘点、A3 设计方案）的\"检验\"是脚本可复现与数字核对，按实际情况标级别，卡片里写明它是分析类。"
      - "每张非深绿的卡片注明：升到下一档是否依赖接上模型（B04）。"
      - "每次卡片变色，都必须有对应级别的测试报告作依据。"
    en:
      - "Light green needs at least in-sample evidence and a deliverable; dark green needs independent-sample or human-review evidence that meets the threshold."
      - "The threshold must be written into the card's \"done when\" before the check is run. If an existing check had no threshold set in advance, its test report says \"threshold not set in advance\", and such a result cannot be used for dark green."
      - "For analysis cards (A2 problem inventory, A3 design proposal) the \"check\" is script reproducibility and number cross-checking; the level is stated as it actually is, and the card says it is an analysis card."
      - "Every card that is not dark green states whether moving up a level depends on connecting the model (B04)."
      - "Every colour change must be backed by a test report of the matching level."
  progress:
    yellow_credit: 0
    note:
      zh: "`[建议，待确认]` 权重方案：每张卡权重 1（`weight` 字段）；灰卡不进分母；黄卡不算部分分（黄卡做了多少没有测量，算分会让数字无法核对），黄卡张数单列。成型度 = Σ权重(浅绿 + 深绿) ÷ Σ权重(非灰卡)；验证度 = Σ权重(深绿) ÷ Σ权重(非灰卡)。"
      en: "`[suggestion, to be confirmed]` Weighting: every card has weight 1 (the `weight` field); grey cards are left out of the denominator; yellow cards get no partial credit (how much of a yellow card is done is not measured, so partial credit would make the number unauditable), and the yellow count is shown separately. Shaped = Σweight(light green + dark green) ÷ Σweight(non-grey cards); Verified = Σweight(dark green) ÷ Σweight(non-grey cards)."
    difference:
      zh: "成型度回答\"做出来、在开发集上跑过、有交付物的有多少\"；验证度回答\"其中有多少经过没见过的数据或别人的核对、并且达到事先定的门槛\"。两个数差得越多，越多的进度只靠样本内证据。"
      en: "Shaped answers \"how much is built, run on the dev split and has a deliverable\"; Verified answers \"how much of that has been checked on unseen data or by someone else, against a threshold set in advance\". The larger the gap, the more of the progress rests on in-sample evidence only."

